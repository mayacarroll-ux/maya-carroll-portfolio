<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maya Carroll</title>
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0b0f;
      --fg: #f5f5f7;
      --muted: #a1a1a6;
      --border: #333338;
      --menu-bg: #17171c;
      --menu-hover: #26262c;
      --menu-active: #2c2c33;
      --footer-color: #6e6e73;
      --shadow: rgba(0, 0, 0, 0.4);
    }
    :root[data-theme="light"] {
      --bg: #f7f7f8;
      --fg: #14141a;
      --muted: #6e6e76;
      --border: #d8d8dd;
      --menu-bg: #ffffff;
      --menu-hover: #f0f0f3;
      --menu-active: #e6e6ea;
      --footer-color: #7a7a82;
      --shadow: rgba(0, 0, 0, 0.12);
    }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
      position: relative;
      transition: background 0.2s ease, color 0.2s ease;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }
    #avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
    }
    h1 {
      font-size: 2rem;
      font-weight: 500;
      margin: 0;
    }
    #site-title {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0;
    }
    #controls {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      font-size: 0.9rem;
    }
    #theme-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.15rem;
      height: 2.15rem;
      font-size: 1rem;
      font-family: inherit;
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0;
      cursor: pointer;
    }
    #theme-toggle:hover {
      border-color: var(--muted);
    }
    #lang-switcher {
      position: relative;
    }
    #lang-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: inherit;
      font-size: inherit;
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.4rem 0.7rem;
      cursor: pointer;
    }
    #lang-toggle:hover {
      border-color: var(--muted);
    }
    #lang-toggle .chevron {
      color: var(--muted);
      font-size: 0.7rem;
      transition: transform 0.15s ease;
    }
    #lang-switcher[data-open="true"] #lang-toggle .chevron {
      transform: rotate(180deg);
    }
    #lang-menu {
      position: absolute;
      top: calc(100% + 0.4rem);
      right: 0;
      min-width: 100%;
      list-style: none;
      margin: 0;
      padding: 0.3rem;
      background: var(--menu-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 24px var(--shadow);
      display: none;
      flex-direction: column;
    }
    #lang-switcher[data-open="true"] #lang-menu {
      display: flex;
    }
    #lang-menu li button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: inherit;
      font-size: inherit;
      background: transparent;
      color: var(--fg);
      border: none;
      border-radius: 5px;
      padding: 0.4rem 0.6rem;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
    }
    #lang-menu li button:hover {
      background: var(--menu-hover);
    }
    #lang-menu li button[aria-current="true"] {
      background: var(--menu-active);
    }
    .flag {
      font-size: 1.1rem;
    }
    .globe {
      font-size: 1rem;
    }
    .menu-heading {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      padding: 0.3rem 0.6rem 0.4rem;
    }
    footer {
      position: absolute;
      bottom: 1.5rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.8rem;
      color: var(--footer-color);
    }
  </style>
</head>
<body>
  <p id="site-title">Maya Carroll</p>

  <div id="controls">
    <button type="button" id="theme-toggle" aria-label="Toggle light/dark theme">
      <span id="theme-icon" aria-hidden="true">🌙</span>
    </button>

    <div id="lang-switcher" data-open="false">
      <button type="button" id="lang-toggle" aria-haspopup="listbox" aria-expanded="false" aria-label="Choose language">
        <span class="globe" aria-hidden="true">🌐</span>
        <span id="lang-toggle-label">EN</span>
        <span class="chevron">▼</span>
      </button>
      <ul id="lang-menu" role="listbox" aria-label="Select language">
        <li class="menu-heading" aria-hidden="true">Language</li>
        <li role="option"><button type="button" data-lang="en"><span class="flag">🇬🇧</span> English</button></li>
        <li role="option"><button type="button" data-lang="es"><span class="flag">🇪🇸</span> Español</button></li>
        <li role="option"><button type="button" data-lang="fi"><span class="flag">🇫🇮</span> Suomi</button></li>
      </ul>
    </div>
  </div>

  <main>
    <img id="avatar" src="avatar.jpg" alt="Maya Carroll" />
    <h1 id="greeting">Hello world</h1>
  </main>

  <footer id="footer">&copy; Maya Carroll 2026 | From Miami to Helsinki&mdash;designing what&rsquo;s next.</footer>

  <script>
    const translations = {
      en: {
        greeting: "Hello world",
        footer: "© Maya Carroll 2026 | From Miami to Helsinki—designing what's next.",
        flag: "🇬🇧",
        label: "EN",
      },
      es: {
        greeting: "Hola mundo",
        footer: "© Maya Carroll 2026 | De Miami a Helsinki—diseñando lo que viene.",
        flag: "🇪🇸",
        label: "ES",
      },
      fi: {
        greeting: "Hei maailma",
        footer: "© Maya Carroll 2026 | Miamista Helsinkiin—suunnitellaan tulevaa.",
        flag: "🇫🇮",
        label: "FI",
      },
    };

    const themeToggle = document.getElementById("theme-toggle");
    const themeIcon = document.getElementById("theme-icon");

    function getTimeOfDayTheme() {
      const hour = new Date().getHours();
      return hour >= 7 && hour < 19 ? "light" : "dark";
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      themeIcon.textContent = theme === "dark" ? "🌙" : "☀️";
      themeToggle.setAttribute(
        "aria-label",
        theme === "dark" ? "Switch to light theme" : "Switch to dark theme"
      );
    }

    themeToggle.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      applyTheme(next);
      localStorage.setItem("theme", next);
    });

    applyTheme(localStorage.getItem("theme") || getTimeOfDayTheme());

    const switcher = document.getElementById("lang-switcher");
    const toggle = document.getElementById("lang-toggle");
    const toggleLabel = document.getElementById("lang-toggle-label");
    const greeting = document.getElementById("greeting");
    const footer = document.getElementById("footer");
    const options = document.querySelectorAll("#lang-menu button");

    function setLanguage(lang) {
      const t = translations[lang];
      if (!t) return;
      greeting.textContent = t.greeting;
      footer.textContent = t.footer;
      toggleLabel.textContent = t.label;
      document.documentElement.lang = lang;
      options.forEach((opt) => {
        opt.setAttribute("aria-current", opt.dataset.lang === lang ? "true" : "false");
      });
      localStorage.setItem("lang", lang);
    }

    function openMenu(open) {
      switcher.setAttribute("data-open", String(open));
      toggle.setAttribute("aria-expanded", String(open));
    }

    toggle.addEventListener("click", () => {
      openMenu(switcher.getAttribute("data-open") !== "true");
    });

    options.forEach((opt) => {
      opt.addEventListener("click", () => {
        setLanguage(opt.dataset.lang);
        openMenu(false);
      });
    });

    document.addEventListener("click", (e) => {
      if (!switcher.contains(e.target)) openMenu(false);
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") openMenu(false);
    });

    const saved = localStorage.getItem("lang");
    const browserLang = navigator.language.slice(0, 2);
    setLanguage(saved || (translations[browserLang] ? browserLang : "en"));
  </script>
</body>
</html>
