<!doctype html>
<html lang="en">
<head>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        var theme =
          saved ||
          (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maya Carroll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    /* ---------- Theme tokens ---------- */
    :root[data-theme="dark"] {
      /* Miami at Night */
      --color-bg: #070b18;
      --color-surface: #10172a;
      --color-text: #f7f3ee;
      --color-text-secondary: #aab4c8;
      --color-accent: #ff5c7a; /* coral */
      --color-accent-2: #39e6d0; /* aqua */
      --color-accent-3: #f4c76b; /* gold */
      --color-border: rgba(247, 243, 238, 0.14);
      --focus-ring: #39e6d0;
      --shadow-elevated: 0 12px 40px rgba(0, 0, 0, 0.55);
      --glow-hover: 0 0 0 1px rgba(57, 230, 208, 0.4), 0 0 18px rgba(57, 230, 208, 0.28);
      --status-glow: 0 0 12px rgba(57, 230, 208, 0.22);
    }
    :root[data-theme="light"] {
      /* Snowy Finnish Forest */
      --color-bg: #f5f7f6;
      --color-surface: #ffffff;
      --color-text: #17211e;
      --color-text-secondary: #60706a;
      --color-accent: #1f5a4a; /* pine */
      --color-accent-2: #a7d8e5; /* ice — decorative only, not for text */
      --color-accent-3: #dce6e2; /* frost — decorative only */
      --color-border: #dce6e2;
      --focus-ring: #1f5a4a;
      --shadow-elevated: 0 12px 32px rgba(23, 33, 30, 0.1);
      --glow-hover: 0 0 0 1px rgba(31, 90, 74, 0.25), 0 6px 20px rgba(23, 33, 30, 0.1);
      --status-glow: none;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      transition: background 0.25s ease, color 0.25s ease;
    }

    /* ---------- Animated location backgrounds ---------- */
    .bg-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
    .bg-scene canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .bg-silhouette {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 34vh;
      min-height: 220px;
    }
    @media (prefers-reduced-motion: reduce) {
      .bg-scene {
        transition: none;
      }
    }

    /* Everything the visitor reads/clicks sits above the fixed backgrounds. */
    #topbar,
    main,
    footer {
      position: relative;
      z-index: 1;
    }

    :focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 3px;
      border-radius: 4px;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem 1rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 500;
      margin: 0;
    }

    /* ---------- Top navigation ---------- */
    #topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.6rem 1.25rem;
      padding: 1rem 1.5rem;
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-border);
    }

    /* ---------- Brand lockup (avatar + signature) ---------- */
    #brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-right: auto;
    }
    #nav-avatar {
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--color-accent-3);
      flex-shrink: 0;
    }
    #site-title {
      font-family: "Dancing Script", cursive;
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--color-text);
      margin: 0;
      line-height: 1;
    }

    /* ---------- Status bar (time + weather) ---------- */
    #status-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem 1.25rem;
      font-size: 0.78rem;
      color: var(--color-text-secondary);
      order: 3;
      flex-basis: 100%;
      justify-content: center;
      padding-top: 0.35rem;
      border-top: 1px solid var(--color-border);
    }
    @media (min-width: 720px) {
      #status-bar {
        order: 2;
        flex-basis: auto;
        justify-content: center;
        padding-top: 0;
        border-top: none;
      }
    }
    .city-status {
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
      white-space: nowrap;
    }
    .city-status .city-name {
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 0.68rem;
      color: var(--color-text);
    }
    .city-status .sep {
      opacity: 0.45;
    }
    .city-status time {
      font-variant-numeric: tabular-nums;
    }
    .city-status .weather {
      display: inline-block;
      min-width: 2.6em;
      color: var(--color-accent-2-text, var(--color-text-secondary));
    }
    :root[data-theme="dark"] .city-status .weather {
      color: var(--color-accent-2);
      text-shadow: var(--status-glow);
    }
    .city-status .weather.is-stale {
      opacity: 0.65;
      font-style: italic;
    }
    .city-status .weather.is-unavailable {
      font-style: italic;
    }
    #unit-toggle {
      background: transparent;
      color: var(--color-text-secondary);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      font-size: 0.7rem;
      padding: 0.2rem 0.45rem;
      cursor: pointer;
      transition: border-color 0.18s ease, color 0.18s ease;
    }
    #unit-toggle:hover {
      border-color: var(--color-accent);
      color: var(--color-text);
    }

    /* ---------- Controls (theme + language) ---------- */
    #controls {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      font-size: 0.9rem;
      margin-left: auto;
    }
    button {
      font-family: inherit;
    }
    #theme-toggle,
    #lang-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: inherit;
      background: var(--color-surface);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.1s ease;
    }
    #theme-toggle {
      justify-content: center;
      width: 2.25rem;
      height: 2.25rem;
      font-size: 1rem;
      padding: 0;
    }
    #lang-toggle {
      padding: 0.4rem 0.7rem;
    }
    #theme-toggle:hover,
    #lang-toggle:hover {
      border-color: var(--color-accent);
      box-shadow: var(--glow-hover);
    }
    #theme-toggle:active,
    #lang-toggle:active {
      transform: scale(0.96);
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    #lang-switcher {
      position: relative;
    }
    #lang-toggle .chevron {
      color: var(--color-text-secondary);
      font-size: 0.7rem;
      transition: transform 0.15s ease;
    }
    #lang-switcher[data-open="true"] #lang-toggle .chevron {
      transform: rotate(180deg);
    }
    #lang-menu {
      position: absolute;
      top: calc(100% + 0.4rem);
      right: 0;
      min-width: 100%;
      list-style: none;
      margin: 0;
      padding: 0.3rem;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-top: 2px solid var(--color-accent);
      border-radius: 8px;
      box-shadow: var(--shadow-elevated);
      display: none;
      flex-direction: column;
    }
    #lang-switcher[data-open="true"] #lang-menu {
      display: flex;
    }
    #lang-menu li button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: inherit;
      background: transparent;
      color: var(--color-text);
      border: none;
      border-radius: 5px;
      padding: 0.4rem 0.6rem;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
      transition: background 0.15s ease;
    }
    #lang-menu li button:hover {
      background: var(--color-bg);
    }
    #lang-menu li button[aria-current="true"] {
      background: var(--color-bg);
      box-shadow: inset 2px 0 0 var(--color-accent);
    }
    .flag {
      font-size: 1.1rem;
    }
    .globe {
      font-size: 1rem;
    }
    .menu-heading {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--color-text-secondary);
      padding: 0.3rem 0.6rem 0.4rem;
    }

    footer {
      text-align: center;
      font-size: 0.8rem;
      color: var(--color-text-secondary);
      padding: 1.5rem 1rem;
    }

    @media (max-width: 480px) {
      #topbar {
        padding: 0.85rem 1rem;
      }
      #status-bar {
        gap: 0.4rem 0.9rem;
        font-size: 0.72rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.001ms !important;
        animation-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div id="bg-miami" class="bg-scene" aria-hidden="true">
    <svg class="bg-silhouette" viewBox="0 0 800 220" preserveAspectRatio="xMidYMax slice">
      <ellipse cx="400" cy="180" rx="380" ry="60" fill="var(--color-accent-3)" opacity="0.08" />

        <rect x="10" y="110" width="36" height="110" />
        <rect x="55" y="80" width="26" height="140" />
        <rect x="95" y="130" width="44" height="90" />
        <polygon points="150,220 150,90 170,90 170,72 190,72 190,90 210,90 210,220" />
        <rect x="225" y="140" width="30" height="80" />
        <rect x="345" y="95" width="40" height="125" />

          <path d="M-2,-78 C-22,-98 -22,-114 -38,-124" />
          <path d="M-2,-78 C6,-104 6,-120 -4,-134" />

  <div id="bg-helsinki" class="bg-scene" aria-hidden="true">
    <svg class="bg-silhouette" viewBox="0 0 800 220" preserveAspectRatio="xMidYMax slice">
      <polygon
        fill="var(--color-text-secondary)"
        opacity="0.32"
        points="0,220 0,150 40,95 80,150 120,85 160,150 200,75 240,150 280,95 320,150 360,80 400,150 440,100 480,150 520,85 560,150 600,95 640,150 680,80 720,150 760,100 800,150 800,220"
      />
      <polygon
        fill="var(--color-accent)"
        opacity="0.85"
        points="0,220 0,175 30,125 60,175 90,115 120,175 150,120 180,175 210,110 240,175 270,125 300,175 330,115 360,175 390,125 420,175 450,110 480,175 510,120 540,175 570,115 600,175 630,125 660,175 690,110 720,175 750,120 780,175 800,175 800,220"
      />
    </svg>
    <canvas id="bg-canvas-helsinki"></canvas>
  </div>

  <header id="topbar">
    <div id="brand">
      <img id="nav-avatar" src="avatar.jpg" alt="Maya Carroll" />
      <p id="site-title">Maya Carroll</p>
    </div>

    <div id="status-bar" aria-label="Local time and weather">
      <div class="city-status" data-city="miami">
        <span class="city-name">Miami</span>
        <span class="sep" aria-hidden="true">&middot;</span>
        <time id="time-miami">&nbsp;</time>
        <span class="sep" aria-hidden="true">&middot;</span>
        <span id="weather-miami" class="weather" aria-live="polite">&hellip;</span>
      </div>
      <div class="city-status" data-city="helsinki">
        <span class="city-name">Helsinki</span>
        <span class="sep" aria-hidden="true">&middot;</span>
        <time id="time-helsinki">&nbsp;</time>
        <span class="sep" aria-hidden="true">&middot;</span>
        <span id="weather-helsinki" class="weather" aria-live="polite">&hellip;</span>
      </div>
      <button type="button" id="unit-toggle" aria-label="Temperature units: default (Miami °F, Helsinki °C). Click to show both in Fahrenheit.">
        °F&thinsp;/&thinsp;°C
      </button>
    </div>

    <div id="controls">
      <button type="button" id="theme-toggle" aria-label="Toggle light/dark theme">
        <span id="theme-icon" aria-hidden="true">🌙</span>
      </button>

      <div id="lang-switcher" data-open="false">
        <button type="button" id="lang-toggle" aria-haspopup="listbox" aria-expanded="false" aria-label="Choose language">
          <span class="globe" aria-hidden="true">🌐</span>
          <span id="lang-toggle-label">EN</span>
          <span class="chevron">▼</span>
        </button>
        <ul id="lang-menu" role="listbox" aria-label="Select language">
          <li class="menu-heading" aria-hidden="true">Language</li>
          <li role="option"><button type="button" data-lang="en"><span class="flag">🇬🇧</span> English</button></li>
          <li role="option"><button type="button" data-lang="es"><span class="flag">🇪🇸</span> Español</button></li>
          <li role="option"><button type="button" data-lang="fi"><span class="flag">🇫🇮</span> Suomi</button></li>
        </ul>
      </div>
    </div>
  </header>

  <main>
    <h1 id="greeting">Hello world</h1>
  </main>

  <footer id="footer">&copy; Maya Carroll 2026 | From Miami to Helsinki&mdash;designing what&rsquo;s next.</footer>

  <script>
    const translations = {
      en: {
        greeting: "Hello world",
        footer: "© Maya Carroll 2026 | From Miami to Helsinki—designing what's next.",
        flag: "🇬🇧",
        label: "EN",
      },
      es: {
        greeting: "Hola mundo",
        footer: "© Maya Carroll 2026 | De Miami a Helsinki—diseñando lo que viene.",
        flag: "🇪🇸",
        label: "ES",
      },
      fi: {
        greeting: "Hei maailma",
        footer: "© Maya Carroll 2026 | Miamista Helsinkiin—suunnitellaan tulevaa.",
        flag: "🇫🇮",
        label: "FI",
      },
    };

    const themeToggle = document.getElementById("theme-toggle");
    const themeIcon = document.getElementById("theme-icon");

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      themeIcon.textContent = theme === "dark" ? "🌙" : "☀️";
      themeToggle.setAttribute(
        "aria-label",
        theme === "dark" ? "Switch to light theme" : "Switch to dark theme"
      );
    }

    // Sync the toggle icon/label with whatever the head script already
    // applied (localStorage override, or OS preference as the default).
    applyTheme(document.documentElement.getAttribute("data-theme") || "light");

    themeToggle.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      applyTheme(next);
      localStorage.setItem("theme", next);
    });

    // Keep following the OS preference live, as long as the visitor hasn't
    // made an explicit choice of their own.
    if (window.matchMedia) {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
        if (!localStorage.getItem("theme")) {
          applyTheme(e.matches ? "dark" : "light");
        }
      });
    }

    const switcher = document.getElementById("lang-switcher");
    const toggle = document.getElementById("lang-toggle");
    const toggleLabel = document.getElementById("lang-toggle-label");
    const greeting = document.getElementById("greeting");
    const footer = document.getElementById("footer");
    const options = document.querySelectorAll("#lang-menu button");

    function setLanguage(lang) {
      const t = translations[lang];
      if (!t) return;
      greeting.textContent = t.greeting;
      footer.textContent = t.footer;
      toggleLabel.textContent = t.label;
      document.documentElement.lang = lang;
      options.forEach((opt) => {
        opt.setAttribute("aria-current", opt.dataset.lang === lang ? "true" : "false");
      });
      localStorage.setItem("lang", lang);
    }

    function openMenu(open) {
      switcher.setAttribute("data-open", String(open));
      toggle.setAttribute("aria-expanded", String(open));
    }

    toggle.addEventListener("click", () => {
      openMenu(switcher.getAttribute("data-open") !== "true");
    });

    options.forEach((opt) => {
      opt.addEventListener("click", () => {
        setLanguage(opt.dataset.lang);
        openMenu(false);
      });
    });

    document.addEventListener("click", (e) => {
      if (!switcher.contains(e.target)) openMenu(false);
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") openMenu(false);
    });

    function getDeviceLanguage() {
      const preferences = navigator.languages && navigator.languages.length
        ? navigator.languages
        : [navigator.language];
      const match = preferences
        .map((tag) => tag.slice(0, 2).toLowerCase())
        .find((code) => translations[code]);
      return match || "en";
    }

    const saved = localStorage.getItem("lang");
    setLanguage(saved || getDeviceLanguage());

    // ---------- Time + weather status bar ----------
    (function () {
      const CITIES = {
        miami: { label: "Miami", timeZone: "America/New_York", lat: 25.7617, lon: -80.1918, defaultUnit: "F" },
        helsinki: { label: "Helsinki", timeZone: "Europe/Helsinki", lat: 60.1699, lon: 24.9384, defaultUnit: "C" },
      };
      const WEATHER_REFRESH_MS = 12 * 60 * 1000; // 10–15 min window
      const CACHE_KEY = "weatherCache";
      const UNIT_KEY = "tempUnitOverride"; // null | "F" | "C"

      const timeEls = {
        miami: document.getElementById("time-miami"),
        helsinki: document.getElementById("time-helsinki"),
      };
      const weatherEls = {
        miami: document.getElementById("weather-miami"),
        helsinki: document.getElementById("weather-helsinki"),
      };
      const unitToggle = document.getElementById("unit-toggle");

      const timeFormatters = {};
      function formatTime(city) {
        if (!timeFormatters[city]) {
          timeFormatters[city] = new Intl.DateTimeFormat(undefined, {
            timeZone: CITIES[city].timeZone,
            hour: "numeric",
            minute: "2-digit",
          });
        }
        return timeFormatters[city].format(new Date());
      }

      function tickClocks() {
        Object.keys(CITIES).forEach((city) => {
          timeEls[city].textContent = formatTime(city);
        });
      }
      tickClocks();
      setInterval(tickClocks, 30 * 1000);

      // ---- Weather ----
      function celsiusToFahrenheit(c) {
        return (c * 9) / 5 + 32;
      }

      function currentUnitFor(city) {
        const override = localStorage.getItem(UNIT_KEY);
        return override === "F" || override === "C" ? override : CITIES[city].defaultUnit;
      }

      function formatTemp(tempC, unit) {
        const value = unit === "F" ? celsiusToFahrenheit(tempC) : tempC;
        return `${Math.round(value)}°${unit}`;
      }

      function loadCache() {
        try {
          return JSON.parse(localStorage.getItem(CACHE_KEY)) || {};
        } catch (e) {
          return {};
        }
      }
      function saveCache(cache) {
        try {
          localStorage.setItem(CACHE_KEY, JSON.stringify(cache));
        } catch (e) {
          /* storage unavailable — degrade silently */
        }
      }

      let cache = loadCache();

      function renderWeather(city) {
        const el = weatherEls[city];
        const entry = cache[city];
        const unit = currentUnitFor(city);

        if (!entry) {
          el.textContent = "…";
          el.classList.remove("is-stale");
          el.classList.remove("is-unavailable");
          el.removeAttribute("title");
          el.setAttribute(
            "aria-label",
            `${CITIES[city].label} weather: loading`
          );
          return;
        }

        if (entry.tempC == null) {
          el.textContent = "Weather unavailable";
          el.classList.add("is-unavailable");
          el.classList.remove("is-stale");
          el.removeAttribute("title");
          el.setAttribute("aria-label", `${CITIES[city].label} weather unavailable`);
          return;
        }

        const isStale = Date.now() - entry.updatedAt > WEATHER_REFRESH_MS * 2;
        el.textContent = formatTemp(entry.tempC, unit);
        el.classList.toggle("is-stale", isStale);
        el.classList.remove("is-unavailable");
        const updatedLabel = new Intl.DateTimeFormat(undefined, {
          hour: "numeric",
          minute: "2-digit",
        }).format(new Date(entry.updatedAt));
        el.title = `Updated ${updatedLabel}`;
        el.setAttribute(
          "aria-label",
          `${CITIES[city].label} temperature: ${formatTemp(entry.tempC, unit)}, updated ${updatedLabel}`
        );
      }

      function renderAll() {
        Object.keys(CITIES).forEach(renderWeather);
      }

      async function fetchWeather(city) {
        const { lat, lon } = CITIES[city];
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m`;
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 6000);
        try {
          const res = await fetch(url, { signal: controller.signal });
          if (!res.ok) throw new Error("Weather request failed");
          const data = await res.json();
          const tempC = data && data.current && typeof data.current.temperature_2m === "number"
            ? data.current.temperature_2m
            : null;
          if (tempC == null) throw new Error("Malformed weather response");
          cache[city] = { tempC, updatedAt: Date.now() };
          saveCache(cache);
        } catch (e) {
          // Keep the last successful reading if we have one; only mark
          // "unavailable" when there has never been a successful reading.
          if (!cache[city]) {
            cache[city] = { tempC: null, updatedAt: Date.now() };
          }
        } finally {
          clearTimeout(timeout);
          renderWeather(city);
        }
      }

      function isStaleEnough(city) {
        const entry = cache[city];
        if (!entry || entry.tempC == null) return true;
        return Date.now() - entry.updatedAt > WEATHER_REFRESH_MS;
      }

      function refreshWeatherIfNeeded() {
        if (document.hidden) return;
        Object.keys(CITIES).forEach((city) => {
          if (isStaleEnough(city)) fetchWeather(city);
        });
      }

      renderAll();
      refreshWeatherIfNeeded();

      let weatherInterval = setInterval(refreshWeatherIfNeeded, WEATHER_REFRESH_MS);

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) refreshWeatherIfNeeded();
      });

      // ---- Unit toggle (cycles: default mixed → all °F → all °C) ----
      function updateUnitToggleLabel() {
        const override = localStorage.getItem(UNIT_KEY);
        const next = override === null ? "F" : override === "F" ? "C" : null;
        const nextLabel =
          next === null
            ? "default units (Miami °F, Helsinki °C)"
            : `both cities in °${next}`;
        unitToggle.setAttribute("aria-label", `Show ${nextLabel}. Currently: ${
          override === null ? "default units" : `both in °${override}`
        }.`);
      }

      unitToggle.addEventListener("click", () => {
        const current = localStorage.getItem(UNIT_KEY);
        const next = current === null ? "F" : current === "F" ? "C" : null;
        if (next === null) {
          localStorage.removeItem(UNIT_KEY);
        } else {
          localStorage.setItem(UNIT_KEY, next);
        }
        renderAll();
        updateUnitToggleLabel();
      });

      updateUnitToggleLabel();
    })();
  </script>
  <script src="background.js"></script>
</body>
</html>
