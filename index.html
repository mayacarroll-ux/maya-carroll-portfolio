<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maya Carroll</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0b0f;
      color: #f5f5f7;
      position: relative;
    }
    h1 {
      font-size: 2rem;
      font-weight: 500;
    }
    #lang-switcher {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      display: flex;
      gap: 0.5rem;
    }
    #lang-switcher button {
      font-family: inherit;
      font-size: 0.85rem;
      background: transparent;
      color: #a1a1a6;
      border: 1px solid #333338;
      border-radius: 6px;
      padding: 0.35rem 0.7rem;
      cursor: pointer;
    }
    #lang-switcher button:hover {
      border-color: #666;
      color: #f5f5f7;
    }
    #lang-switcher button[aria-current="true"] {
      background: #f5f5f7;
      color: #0b0b0f;
      border-color: #f5f5f7;
    }
  </style>
</head>
<body>
  <nav id="lang-switcher" aria-label="Language switcher">
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="es">ES</button>
    <button type="button" data-lang="fi">FI</button>
  </nav>
  <h1 id="greeting">Hello world</h1>

  <script>
    const translations = {
      en: "Hello world",
      es: "Hola mundo",
      fi: "Hei maailma",
    };

    const greeting = document.getElementById("greeting");
    const buttons = document.querySelectorAll("#lang-switcher button");

    function setLanguage(lang) {
      if (!translations[lang]) return;
      greeting.textContent = translations[lang];
      document.documentElement.lang = lang;
      buttons.forEach((btn) => {
        btn.setAttribute("aria-current", btn.dataset.lang === lang ? "true" : "false");
      });
      localStorage.setItem("lang", lang);
    }

    buttons.forEach((btn) => {
      btn.addEventListener("click", () => setLanguage(btn.dataset.lang));
    });

    const saved = localStorage.getItem("lang");
    const browserLang = navigator.language.slice(0, 2);
    setLanguage(saved || (translations[browserLang] ? browserLang : "en"));
  </script>
</body>
</html>
