<!doctype html>
<html lang="en">
<head>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        var theme =
          saved ||
          (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maya Carroll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    /* ---------- Theme tokens ---------- */
    :root[data-theme="dark"] {
      /* Miami at Night */
      --color-bg: #070b18;
      --color-surface: #10172a;
      --color-text: #f7f3ee;
      --color-text-secondary: #aab4c8;
      --color-accent: #ff5c7a; /* coral */
      --color-accent-2: #39e6d0; /* aqua */
      --color-accent-3: #f4c76b; /* gold */
      --color-border: rgba(247, 243, 238, 0.14);
      --focus-ring: #39e6d0;
      --shadow-elevated: 0 12px 40px rgba(0, 0, 0, 0.55);
      --glow-hover: 0 0 0 1px rgba(57, 230, 208, 0.4), 0 0 18px rgba(57, 230, 208, 0.28);
    }
    :root[data-theme="light"] {
      /* Snowy Finnish Forest */
      --color-bg: #f5f7f6;
      --color-surface: #ffffff;
      --color-text: #17211e;
      --color-text-secondary: #60706a;
      --color-accent: #1f5a4a; /* pine */
      --color-accent-2: #a7d8e5; /* ice — decorative only, not for text */
      --color-accent-3: #dce6e2; /* frost — decorative only */
      --color-border: #dce6e2;
      --focus-ring: #1f5a4a;
      --shadow-elevated: 0 12px 32px rgba(23, 33, 30, 0.1);
      --glow-hover: 0 0 0 1px rgba(31, 90, 74, 0.25), 0 6px 20px rgba(23, 33, 30, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      position: relative;
      transition: background 0.25s ease, color 0.25s ease;
    }

    :focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 3px;
      border-radius: 4px;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 500;
      margin: 0;
    }

    /* ---------- Brand lockup (avatar + signature) ---------- */
    #brand {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    #nav-avatar {
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--color-accent-3);
      flex-shrink: 0;
    }
    #site-title {
      font-family: "Dancing Script", cursive;
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--color-text);
      margin: 0;
      line-height: 1;
    }

    /* ---------- Controls (theme + language) ---------- */
    #controls {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      font-size: 0.9rem;
    }
    button {
      font-family: inherit;
    }
    #theme-toggle,
    #lang-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: inherit;
      background: var(--color-surface);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.1s ease;
    }
    #theme-toggle {
      justify-content: center;
      width: 2.25rem;
      height: 2.25rem;
      font-size: 1rem;
      padding: 0;
    }
    #lang-toggle {
      padding: 0.4rem 0.7rem;
    }
    #theme-toggle:hover,
    #lang-toggle:hover {
      border-color: var(--color-accent);
      box-shadow: var(--glow-hover);
    }
    #theme-toggle:active,
    #lang-toggle:active {
      transform: scale(0.96);
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    #lang-switcher {
      position: relative;
    }
    #lang-toggle .chevron {
      color: var(--color-text-secondary);
      font-size: 0.7rem;
      transition: transform 0.15s ease;
    }
    #lang-switcher[data-open="true"] #lang-toggle .chevron {
      transform: rotate(180deg);
    }
    #lang-menu {
      position: absolute;
      top: calc(100% + 0.4rem);
      right: 0;
      min-width: 100%;
      list-style: none;
      margin: 0;
      padding: 0.3rem;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-top: 2px solid var(--color-accent);
      border-radius: 8px;
      box-shadow: var(--shadow-elevated);
      display: none;
      flex-direction: column;
    }
    #lang-switcher[data-open="true"] #lang-menu {
      display: flex;
    }
    #lang-menu li button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: inherit;
      background: transparent;
      color: var(--color-text);
      border: none;
      border-radius: 5px;
      padding: 0.4rem 0.6rem;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
      transition: background 0.15s ease;
    }
    #lang-menu li button:hover {
      background: var(--color-bg);
    }
    #lang-menu li button[aria-current="true"] {
      background: var(--color-bg);
      box-shadow: inset 2px 0 0 var(--color-accent);
    }
    .flag {
      font-size: 1.1rem;
    }
    .globe {
      font-size: 1rem;
    }
    .menu-heading {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--color-text-secondary);
      padding: 0.3rem 0.6rem 0.4rem;
    }

    footer {
      position: absolute;
      bottom: 1.5rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.8rem;
      color: var(--color-text-secondary);
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.001ms !important;
        animation-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div id="brand">
    <img id="nav-avatar" src="avatar.jpg" alt="Maya Carroll" />
    <p id="site-title">Maya Carroll</p>
  </div>

  <div id="controls">
    <button type="button" id="theme-toggle" aria-label="Toggle light/dark theme">
      <span id="theme-icon" aria-hidden="true">🌙</span>
    </button>

    <div id="lang-switcher" data-open="false">
      <button type="button" id="lang-toggle" aria-haspopup="listbox" aria-expanded="false" aria-label="Choose language">
        <span class="globe" aria-hidden="true">🌐</span>
        <span id="lang-toggle-label">EN</span>
        <span class="chevron">▼</span>
      </button>
      <ul id="lang-menu" role="listbox" aria-label="Select language">
        <li class="menu-heading" aria-hidden="true">Language</li>
        <li role="option"><button type="button" data-lang="en"><span class="flag">🇬🇧</span> English</button></li>
        <li role="option"><button type="button" data-lang="es"><span class="flag">🇪🇸</span> Español</button></li>
        <li role="option"><button type="button" data-lang="fi"><span class="flag">🇫🇮</span> Suomi</button></li>
      </ul>
    </div>
  </div>

  <main>
    <h1 id="greeting">Hello world</h1>
  </main>

  <footer id="footer">&copy; Maya Carroll 2026 | From Miami to Helsinki&mdash;designing what&rsquo;s next.</footer>

  <script>
    const translations = {
      en: {
        greeting: "Hello world",
        footer: "© Maya Carroll 2026 | From Miami to Helsinki—designing what's next.",
        flag: "🇬🇧",
        label: "EN",
      },
      es: {
        greeting: "Hola mundo",
        footer: "© Maya Carroll 2026 | De Miami a Helsinki—diseñando lo que viene.",
        flag: "🇪🇸",
        label: "ES",
      },
      fi: {
        greeting: "Hei maailma",
        footer: "© Maya Carroll 2026 | Miamista Helsinkiin—suunnitellaan tulevaa.",
        flag: "🇫🇮",
        label: "FI",
      },
    };

    const themeToggle = document.getElementById("theme-toggle");
    const themeIcon = document.getElementById("theme-icon");

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      themeIcon.textContent = theme === "dark" ? "🌙" : "☀️";
      themeToggle.setAttribute(
        "aria-label",
        theme === "dark" ? "Switch to light theme" : "Switch to dark theme"
      );
    }

    // Sync the toggle icon/label with whatever the head script already
    // applied (localStorage override, or OS preference as the default).
    applyTheme(document.documentElement.getAttribute("data-theme") || "light");

    themeToggle.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      applyTheme(next);
      localStorage.setItem("theme", next);
    });

    // Keep following the OS preference live, as long as the visitor hasn't
    // made an explicit choice of their own.
    if (window.matchMedia) {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
        if (!localStorage.getItem("theme")) {
          applyTheme(e.matches ? "dark" : "light");
        }
      });
    }

    const switcher = document.getElementById("lang-switcher");
    const toggle = document.getElementById("lang-toggle");
    const toggleLabel = document.getElementById("lang-toggle-label");
    const greeting = document.getElementById("greeting");
    const footer = document.getElementById("footer");
    const options = document.querySelectorAll("#lang-menu button");

    function setLanguage(lang) {
      const t = translations[lang];
      if (!t) return;
      greeting.textContent = t.greeting;
      footer.textContent = t.footer;
      toggleLabel.textContent = t.label;
      document.documentElement.lang = lang;
      options.forEach((opt) => {
        opt.setAttribute("aria-current", opt.dataset.lang === lang ? "true" : "false");
      });
      localStorage.setItem("lang", lang);
    }

    function openMenu(open) {
      switcher.setAttribute("data-open", String(open));
      toggle.setAttribute("aria-expanded", String(open));
    }

    toggle.addEventListener("click", () => {
      openMenu(switcher.getAttribute("data-open") !== "true");
    });

    options.forEach((opt) => {
      opt.addEventListener("click", () => {
        setLanguage(opt.dataset.lang);
        openMenu(false);
      });
    });

    document.addEventListener("click", (e) => {
      if (!switcher.contains(e.target)) openMenu(false);
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") openMenu(false);
    });

    function getDeviceLanguage() {
      const preferences = navigator.languages && navigator.languages.length
        ? navigator.languages
        : [navigator.language];
      const match = preferences
        .map((tag) => tag.slice(0, 2).toLowerCase())
        .find((code) => translations[code]);
      return match || "en";
    }

    const saved = localStorage.getItem("lang");
    setLanguage(saved || getDeviceLanguage());
  </script>
</body>
</html>
