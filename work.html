<!doctype html>
<html lang="en">
<head>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        var theme =
          saved ||
          (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Selected Work | Maya Carroll</title>
  <meta
    name="description"
    content="Product design case studies from Maya Carroll, an AI product and design leader working across product strategy, human-AI interaction, and enterprise UX."
  />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://maya-carroll-portfolio.vercel.app/work.html" />
  <meta property="og:title" content="Selected Work | Maya Carroll" />
  <meta
    property="og:description"
    content="Product design case studies from Maya Carroll, an AI product and design leader working across product strategy, human-AI interaction, and enterprise UX."
  />
  <link rel="canonical" href="https://maya-carroll-portfolio.vercel.app/work.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --font-primary: "Manrope", sans-serif;
    }
    :root[data-theme="dark"] {
      --color-bg: #070b18;
      --color-surface: #10172a;
      --color-surface-translucent: rgba(16, 23, 42, 0.74);
      --color-text: #f7f3ee;
      --color-text-secondary: #aab4c8;
      --color-accent: #39e6d0;
      --color-accent-2: #39e6d0;
      --color-accent-3: #f4c76b;
      --color-warning: #ff5c7a;
      --color-border: rgba(247, 243, 238, 0.14);
      --focus-ring: #39e6d0;
      --shadow-elevated: 0 12px 40px rgba(0, 0, 0, 0.55);
      --glow-hover: 0 0 0 1px rgba(57, 230, 208, 0.4), 0 0 18px rgba(57, 230, 208, 0.28);
      --status-glow: 0 0 12px rgba(57, 230, 208, 0.22);
    }
    :root[data-theme="light"] {
      --color-bg: #f5f7f6;
      --color-surface: #ffffff;
      --color-surface-translucent: rgba(255, 255, 255, 0.78);
      --color-text: #17211e;
      --color-text-secondary: #60706a;
      --color-accent: #1f5a4a;
      --color-accent-2: #a7d8e5;
      --color-accent-3: #dce6e2;
      --color-warning: #c23b52;
      --color-border: #dce6e2;
      --focus-ring: #1f5a4a;
      --shadow-elevated: 0 12px 32px rgba(23, 33, 30, 0.1);
      --glow-hover: 0 0 0 1px rgba(31, 90, 74, 0.25), 0 6px 20px rgba(23, 33, 30, 0.1);
      --status-glow: none;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: var(--font-primary);
      font-weight: 400;
      letter-spacing: -0.01em;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.55;
    }
    :focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }
    main {
      flex: 1 0 auto;
      padding-bottom: 4rem;
    }
    h1, h2, h3 {
      font-family: var(--font-primary);
      font-weight: 700;
      margin: 0;
    }
    h1 {
      font-size: clamp(1.9rem, 4vw, 2.6rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }
    h2 {
      font-size: clamp(1.4rem, 3vw, 1.8rem);
      letter-spacing: -0.02em;
    }

    /* ==================== Header (same as index.html) ====================
       Kept byte-identical in structure across pages on purpose so it
       doesn't drift. No #city-strip / animated background here — this is
       a content page, same footprint as dashboard.html/calendar.html. */
    #topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-border);
    }
    #header-primary {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      padding: 0.85rem 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    #brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
      color: inherit;
      flex-shrink: 0;
    }
    #nav-avatar {
      width: 2.6rem;
      height: 2.6rem;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--color-accent-3);
      flex-shrink: 0;
    }
    #site-title {
      font-family: var(--font-primary);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--color-text);
      line-height: 1;
      font-size: 1.35rem;
      white-space: nowrap;
    }
    @media (max-width: 599px) {
      #site-title {
        font-size: 1.15rem;
      }
    }
    #primary-nav {
      display: flex;
      gap: 1.6rem;
      font-size: 0.9rem;
      margin-right: auto;
    }
    #primary-nav a {
      color: var(--color-text-secondary);
      text-decoration: none;
      font-family: var(--font-primary);
      font-weight: 600;
      padding: 0.3rem 0.1rem;
    }
    #primary-nav a:hover,
    #primary-nav a:focus-visible,
    #primary-nav a[aria-current="page"] {
      color: var(--color-text);
    }
    #account-nav {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      font-size: 0.8rem;
    }
    #account-nav a {
      color: var(--color-text-secondary);
      text-decoration: none;
      font-family: var(--font-primary);
      font-weight: 600;
      opacity: 0.75;
      padding: 0.3rem 0.1rem;
    }
    #account-nav a:hover,
    #account-nav a:focus-visible {
      opacity: 1;
      color: var(--color-text);
    }
    /* Session-ending action, not a navigation destination like Calendar
       or Dashboard next to it — a distinct color signals that before the
       visitor taps it. Specificity has to match (or beat) the mobile
       drawer's own #account-nav a rule below, or it loses the cascade
       and silently falls back to the shared secondary-text color. */
    #account-nav a#nav-signout,
    #mobile-menu-account-slot #account-nav a#nav-signout {
      color: var(--color-warning);
    }
    #account-nav a#nav-signout:hover,
    #account-nav a#nav-signout:focus-visible,
    #mobile-menu-account-slot #account-nav a#nav-signout:hover,
    #mobile-menu-account-slot #account-nav a#nav-signout:focus-visible {
      color: var(--color-warning);
      opacity: 1;
    }
    #preferences {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    button {
      font-family: var(--font-primary);
      font-weight: 600;
    }
    #theme-toggle,
    #lang-toggle {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.82rem;
      background: var(--color-surface);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      cursor: pointer;
      min-height: 44px;
      padding: 0.5rem 0.75rem;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.1s ease;
    }
    #theme-toggle:hover,
    #lang-toggle:hover {
      border-color: var(--color-accent);
      box-shadow: var(--glow-hover);
    }
    #theme-toggle:active,
    #lang-toggle:active {
      transform: scale(0.96);
    }
    #theme-label {
      font-weight: 600;
    }
    #lang-switcher {
      position: relative;
    }
    #lang-toggle .chevron {
      color: var(--color-text-secondary);
      font-size: 0.7rem;
      transition: transform 0.15s ease;
    }
    #lang-switcher[data-open="true"] #lang-toggle .chevron {
      transform: rotate(180deg);
    }
    #lang-menu {
      position: absolute;
      top: calc(100% + 0.4rem);
      right: 0;
      min-width: 100%;
      list-style: none;
      margin: 0;
      padding: 0.3rem;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-top: 2px solid var(--color-accent);
      border-radius: 8px;
      box-shadow: var(--shadow-elevated);
      display: none;
      flex-direction: column;
      z-index: 5;
    }
    #lang-switcher[data-open="true"] #lang-menu {
      display: flex;
    }
    #lang-menu li button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: inherit;
      background: transparent;
      color: var(--color-text);
      border: none;
      border-radius: 5px;
      padding: 0.4rem 0.6rem;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
      min-height: 40px;
      transition: background 0.15s ease;
    }
    #lang-menu li button:hover {
      background: var(--color-bg);
    }
    #lang-menu li button[aria-current="true"] {
      background: var(--color-bg);
      box-shadow: inset 2px 0 0 var(--color-accent);
    }
    .flag {
      font-size: 1.1rem;
    }
    .globe {
      font-size: 1rem;
    }
    .menu-heading {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--color-text-secondary);
      padding: 0.3rem 0.6rem 0.4rem;
    }
    #menu-toggle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      background: var(--color-surface);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      cursor: pointer;
    }
    #menu-toggle:hover {
      border-color: var(--color-accent);
    }
    .menu-icon {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 18px;
    }
    .menu-icon span {
      display: block;
      height: 2px;
      border-radius: 1px;
      background: currentColor;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    #menu-toggle[aria-expanded="true"] .menu-icon span:nth-child(1) {
      transform: translateY(6px) rotate(45deg);
    }
    #menu-toggle[aria-expanded="true"] .menu-icon span:nth-child(2) {
      opacity: 0;
    }
    #menu-toggle[aria-expanded="true"] .menu-icon span:nth-child(3) {
      transform: translateY(-6px) rotate(-45deg);
    }
    @media (prefers-reduced-motion: reduce) {
      .menu-icon span {
        transition: none;
      }
    }
    @media (max-width: 959px) {
      #primary-nav,
      #account-nav,
      #header-primary > #preferences {
        display: none;
      }
      #menu-toggle {
        display: flex;
        margin-left: auto;
      }
    }
    #mobile-menu-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 40;
    }
    #mobile-menu-backdrop[hidden] {
      display: none;
    }
    #mobile-menu {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(320px, 85vw);
      background: var(--color-surface);
      border-left: 1px solid var(--color-border);
      z-index: 50;
      display: flex;
      flex-direction: column;
      padding: 1.25rem;
      overflow-y: auto;
      box-shadow: var(--shadow-elevated);
    }
    #mobile-menu[hidden] {
      display: none;
    }
    #mobile-menu-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }
    #mobile-menu-title {
      font-weight: 700;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-text-secondary);
    }
    #mobile-menu-close {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      line-height: 1;
      background: transparent;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      color: var(--color-text);
      cursor: pointer;
    }
    #mobile-menu-close:hover {
      border-color: var(--color-accent);
    }
    #mobile-menu-nav-slot #primary-nav {
      display: flex;
      flex-direction: column;
      gap: 0;
      font-size: 1.05rem;
      margin: 0 0 1.5rem;
    }
    #mobile-menu-nav-slot #primary-nav a {
      padding: 0.8rem 0.2rem;
      border-bottom: 1px solid var(--color-border);
      min-height: 44px;
      display: flex;
      align-items: center;
    }
    #mobile-menu-account-slot #account-nav {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      font-size: 1.05rem;
      margin: 0 0 1.5rem;
    }
    #mobile-menu-account-slot #account-nav a {
      padding: 0.8rem 0.2rem;
      border-bottom: 1px solid var(--color-border);
      min-height: 44px;
      display: flex;
      align-items: center;
      opacity: 0.75;
    }
    #mobile-menu-account-slot #account-nav a[hidden] {
      display: none;
    }
    #mobile-menu-account .menu-heading,
    #mobile-menu-prefs .menu-heading {
      padding: 0 0 0.6rem;
    }
    #mobile-menu-prefs-slot #preferences {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.6rem;
    }
    #mobile-menu-prefs-slot #theme-toggle,
    #mobile-menu-prefs-slot #lang-toggle {
      width: 100%;
      justify-content: flex-start;
      font-size: 0.92rem;
    }
    #mobile-menu-prefs-slot #lang-menu {
      position: static;
      margin-top: 0.4rem;
      box-shadow: none;
      display: flex;
    }
    #mobile-menu-prefs-slot #lang-switcher[data-open="false"] #lang-menu {
      display: none;
    }
    body.menu-open {
      overflow: hidden;
    }

    /* ==================== Work section ==================== */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }
    section {
      padding: clamp(2.25rem, 5vw, 3.75rem) 0;
    }
    .surface {
      background: var(--color-surface-translucent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--color-border);
      border-radius: 14px;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.25rem;
    }
    .card {
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .card h3 {
      color: var(--color-text);
    }
    .card p {
      font-size: 0.92rem;
    }
    .work-card .work-meta {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-size: 0.82rem;
      color: var(--color-text-secondary);
      margin-top: 0.4rem;
    }
    .work-card .work-meta strong {
      color: var(--color-text);
      font-weight: 600;
    }
    #work h2 {
      margin-bottom: 0.5rem;
    }
    #work-subhead {
      max-width: 46ch;
      margin: 0 0 1.75rem;
    }
    .work-grid {
      grid-template-columns: repeat(auto-fit, minmax(min(400px, 100%), 1fr));
    }
    .work-card {
      position: relative;
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
    }
    .work-card:hover,
    .work-card:focus-within {
      border-color: var(--color-accent);
      box-shadow: var(--glow-hover);
      transform: translateY(-2px);
    }
    @media (prefers-reduced-motion: reduce) {
      .work-card {
        transition: border-color 0.18s ease, box-shadow 0.18s ease;
      }
      .work-card:hover,
      .work-card:focus-within {
        transform: none;
      }
    }
    .work-card-thumb {
      position: relative;
      aspect-ratio: 16 / 10;
      border-bottom: 1px solid var(--color-border);
      overflow: hidden;
      flex-shrink: 0;
    }
    /* "For placement only" watermark — see the note at the top of
       work-data.js. Matches the same stamp on the case-study template. */
    .fpo-stamp {
      position: absolute;
      top: 0.6rem;
      right: 0.6rem;
      font-family: "SF Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--color-warning);
      background: var(--color-bg);
      border: 1px solid var(--color-warning);
      border-radius: 4px;
      padding: 0.12rem 0.4rem;
      opacity: 0.85;
      pointer-events: none;
    }

    /* ==================== UI mockups (FPO card covers) ====================
       Same skeleton-screen system as the case-study template — real chrome
       and layout, gray bars standing in for actual text/data — so each
       card's cover matches its detail page's hero image. See work-data.js
       for the note on why these are code-built rather than generated. */
    .work-card-thumb .ui-mockup {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--color-bg);
    }
    .ui-mockup-topbar {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 7px 10px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
    }
    .ui-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      opacity: 0.55;
      flex-shrink: 0;
    }
    .ui-mockup-url {
      margin-left: 6px;
      font-size: 8px;
      font-family: "SF Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
      color: var(--color-text-secondary);
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      padding: 2px 8px;
    }
    .ui-mockup-body {
      flex: 1;
      display: flex;
      min-height: 0;
    }
    .ui-sidebar {
      width: 16%;
      min-width: 28px;
      background: var(--color-surface);
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 7px;
      flex-shrink: 0;
    }
    .ui-sidebar-item {
      height: 7px;
      border-radius: 3px;
      background: var(--color-text-secondary);
      opacity: 0.22;
    }
    .ui-sidebar-item.active {
      background: var(--color-accent);
      opacity: 0.9;
    }
    .ui-main {
      flex: 1;
      padding: 9px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
      min-width: 0;
    }
    /* Skeleton-loading shimmer — the standard motion language for this
       exact visual style, so the covers read as "live" without inventing
       a different animation idiom. Staggered per bar via an inline
       animation-delay set in JS (see renderThumb's uiBar calls) so a
       whole card doesn't flash in lockstep. */
    @keyframes ui-shimmer {
      0% { background-position: -150% 0; }
      100% { background-position: 250% 0; }
    }
    @keyframes ui-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.82); }
    }
    .ui-bar {
      height: 5px;
      border-radius: 2.5px;
      opacity: 0.28;
      background-image: linear-gradient(
        90deg,
        var(--color-text-secondary) 0%,
        var(--color-text-secondary) 42%,
        var(--color-accent) 50%,
        var(--color-text-secondary) 58%,
        var(--color-text-secondary) 100%
      );
      background-size: 250% 100%;
      animation: ui-shimmer 2.6s ease-in-out infinite;
    }
    .ui-bar.dim { opacity: 0.15; }
    .ui-bar.accent { background: var(--color-accent); background-image: none; opacity: 0.85; animation: none; }
    .ui-bar.w20 { width: 20%; } .ui-bar.w30 { width: 30%; } .ui-bar.w40 { width: 40%; }
    .ui-bar.w50 { width: 50%; } .ui-bar.w60 { width: 60%; } .ui-bar.w70 { width: 70%; }
    .ui-bar.w80 { width: 80%; } .ui-bar.w90 { width: 90%; }
    @media (prefers-reduced-motion: reduce) {
      .ui-bar, .ui-row-badge.sev-high, .ui-row-severity-bar.sev-high {
        animation: none !important;
      }
    }

    .ui-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 8px;
      border-radius: 6px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      flex-shrink: 0;
    }
    .ui-row-badge {
      flex-shrink: 0;
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }
    .ui-row-badge.sev-high { background: var(--color-warning); animation: ui-pulse 1.6s ease-in-out infinite; }
    .ui-row-badge.sev-med { background: var(--color-accent-3); }
    .ui-row-badge.sev-low { background: var(--color-text-secondary); opacity: 0.4; }
    .ui-row-severity-bar {
      flex-shrink: 0;
      width: 3px;
      align-self: stretch;
      border-radius: 2px;
    }
    .ui-row-severity-bar.sev-high {
      animation: ui-pulse 1.6s ease-in-out infinite;
    }
    .ui-row-lines {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .ui-pill {
      flex-shrink: 0;
      font-size: 6.5px;
      font-weight: 700;
      letter-spacing: 0.03em;
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      color: var(--color-text-secondary);
    }

    .ui-table {
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--color-border);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      overflow: hidden;
    }

      flex-direction: column;

      gap: 5px;

      border-radius: 4px;

    .ui-chaos-wrap {

      position: relative;
      padding: 8px;

    .ui-chaos-sheet {
      position: absolute;
      width: 44%;
      height: 50%;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      box-shadow: var(--shadow-elevated);
      padding: 5px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 2px;

    .ui-chaos-cell {

    .work-card-link:focus-visible {

      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.1s ease;

      background: var(--color-accent);

    footer {

      padding: 0.85rem 1.5rem 1rem;

    footer .copyright {
      margin: 0;
      font-size: 0.75rem;
      font-weight: 500;
      opacity: 0.8;
      color: var(--color-text-secondary);
      white-space: nowrap;
    }

    /* ---------- Footer: shared city-strip (time + weather + currency) ----------
       Markup/behavior powered by footer-widget.js — kept in sync with
       index.html's inline copy of the same widget. */
    #city-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.4rem 1.5rem;
      padding-bottom: 0.55rem;
      margin-bottom: 0.45rem;
      font-size: 0.76rem;
      color: var(--color-text-secondary);
      width: 100%;
      position: relative;
    }
    #city-strip::after {
      content: "";
      position: absolute;
      left: -1.5rem;
      right: -1.5rem;
      bottom: 0;
      border-bottom: 1px solid var(--color-border);
    }
    .city-status {
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
      white-space: nowrap;
      min-width: 0;
    }
    .city-status .city-name {
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 0.68rem;
      color: var(--color-text);
    }
    .city-status .sep {
      opacity: 0.45;
    }
    .city-status time {
      font-variant-numeric: tabular-nums;
    }
    #currency-status {
      display: flex;
      align-items: baseline;
      gap: 0.35rem;
      white-space: nowrap;
    }
    #currency-status .currency-icon {
      font-size: 0.95em;
    }
    #currency-rate {
      font-variant-numeric: tabular-nums;
      color: var(--color-accent-2-text, var(--color-text-secondary));
    }
    :root[data-theme="dark"] #currency-rate {
      color: var(--color-accent-2);
      text-shadow: var(--status-glow);
    }
    .city-status .weather {
      display: inline-block;
      min-width: 2.6em;
      color: var(--color-accent-2-text, var(--color-text-secondary));
      white-space: normal;
    }
    .city-status .weather-icon {
      font-size: 0.95em;
      filter: grayscale(0.15);
    }
    .city-status .feels-like {
      font-size: 0.85em;
      opacity: 0.7;
      font-weight: 400;
    }
    :root[data-theme="dark"] .city-status .weather {
      color: var(--color-accent-2);
      text-shadow: var(--status-glow);
    }
    .city-status .weather.is-stale {
      opacity: 0.65;
      font-style: italic;
    }
    .city-status .weather.is-unavailable {
      font-style: italic;
    }
    .city-status .uv {
      display: inline-flex;
      align-items: center;
      gap: 0.32em;
      font-size: 0.82em;
      font-weight: 500;
      color: var(--color-text-secondary);
      white-space: normal;
    }
    .city-status .uv-dot {
      width: 0.55em;
      height: 0.55em;
      min-width: 0.55em;
      border-radius: 50%;
    }
    .city-status .uv-moderate .uv-dot {
      background: #e8c25a;
    }
    .city-status .uv-high .uv-dot {
      background: #ff9d4d;
    }
    .city-status .uv-veryhigh .uv-dot {
      background: #ff5c7a;
    }
    .city-status .uv-extreme .uv-dot {
      background: #b073ff;
    }
    .city-status .uv.uv-elevated {
      font-weight: 700;
      color: var(--color-warning);
      border: 1px solid var(--color-warning);
      border-radius: 999px;
      padding: 0.05rem 0.55rem 0.05rem 0.4rem;
    }
    .severe-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3em;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--color-warning);
      border: 1px solid var(--color-warning);
      border-radius: 999px;
      padding: 0.1rem 0.55rem;
      white-space: normal;
    }
    .severe-badge:empty {
      display: none;
      padding: 0;
      border: 0;
    }
    .severe-badge a {
      color: inherit;
      text-decoration: none;
    }
    .severe-badge a:hover,
    .severe-badge a:focus-visible {
      text-decoration: underline;
    }
    /* Below 600px the three items (Miami, Helsinki, currency) no longer
       fit on one line without cramped wrapping — instead of a 2-column
       grid, show one at a time on a slow auto-rotating loop (JS in
       footer-widget.js toggles .is-active on #city-strip's three direct
       children). The fade only runs when motion isn't reduced; the
       rotation itself still happens either way since it's a content swap,
       not decorative motion. */
    @media (max-width: 599px) {
      #city-strip {
        display: block;
        position: relative;
      }
      #city-strip > * {
        display: none;
      }
      #city-strip > *.is-active {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        animation: city-strip-fade 0.6s ease;
      }
      footer {
        font-size: 0.76rem;
      }
      footer p {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.15rem;
      }
    }
    @media (max-width: 599px) and (prefers-reduced-motion: reduce) {
      #city-strip > *.is-active {
        animation: none;
      }
    }
    @keyframes city-strip-fade {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
  </style>

    // ---------- Theme toggle ----------
    var themeToggle = document.getElementById("theme-toggle");
    var themeIcon = document.getElementById("theme-icon");
    var themeLabel = document.getElementById("theme-label");

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      themeIcon.textContent = theme === "dark" ? "🌙" : "☀️";
      themeLabel.textContent = theme === "dark" ? "Dark" : "Light";
      themeToggle.setAttribute(
        "aria-label",
        theme === "dark" ? "Theme: Dark. Switch to light theme" : "Theme: Light. Switch to dark theme"
      );
    }
    applyTheme(document.documentElement.getAttribute("data-theme") || "light");
    themeToggle.addEventListener("click", function () {
      var current = document.documentElement.getAttribute("data-theme");
      var next = current === "dark" ? "light" : "dark";
      applyTheme(next);
      localStorage.setItem("theme", next);
    });
    if (window.matchMedia) {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function (e) {
        if (!localStorage.getItem("theme")) applyTheme(e.matches ? "dark" : "light");
      });
    }

    // ---------- Language switcher ----------
    var switcher = document.getElementById("lang-switcher");
    var langToggle = document.getElementById("lang-toggle");
    var toggleLabel = document.getElementById("lang-toggle-label");
    var langOptions = document.querySelectorAll("#lang-menu button");
    var i18nEls = document.querySelectorAll("[data-i18n]");

    function setLanguage(lang) {
      var t = translations[lang];
      if (!t) return;
      i18nEls.forEach(function (el) {
        var key = el.dataset.i18n;
        if (t[key]) el.textContent = t[key];
      });
      toggleLabel.textContent = t.label;
      langToggle.setAttribute("aria-label", "Language: " + t.fullName + ". Choose a different language");
      document.documentElement.lang = lang;
      langOptions.forEach(function (opt) {
        opt.setAttribute("aria-current", opt.dataset.lang === lang ? "true" : "false");
      });
      localStorage.setItem("lang", lang);
      // Lets footer-widget.js (weather/currency ticker) re-render itself in
      // the new language without this code needing to know it exists.
      document.dispatchEvent(new CustomEvent("app:languagechange"));
    }

    function openLangMenu(open) {
      switcher.setAttribute("data-open", String(open));
      langToggle.setAttribute("aria-expanded", String(open));
    }
    langToggle.addEventListener("click", function () {
      openLangMenu(switcher.getAttribute("data-open") !== "true");
    });
    langOptions.forEach(function (opt) {
      opt.addEventListener("click", function () {
        setLanguage(opt.dataset.lang);
        openLangMenu(false);
      });
    });
    document.addEventListener("click", function (e) {
      if (!switcher.contains(e.target)) openLangMenu(false);
    });

    function getDeviceLanguage() {

      if (!topbar || !headerPrimary || !nav || !menuToggle || !drawer) return;

      var mq = window.matchMedia("(max-width: 959px)");
      function placeControls(isNarrow) {
        if (isNarrow) {
          navSlot.appendChild(nav);
          accountSlot.appendChild(accountNav);
          prefsSlot.appendChild(prefs);
        } else {
          headerPrimary.insertBefore(nav, menuToggle);
          headerPrimary.insertBefore(accountNav, menuToggle);
          headerPrimary.insertBefore(prefs, menuToggle);
        }
      }
      placeControls(mq.matches);

      var lastFocused = null;
      function trapFocus(e) {
        if (e.key !== "Tab") return;
        var focusable = Array.prototype.filter.call(
          drawer.querySelectorAll('a[href], button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"])'),
          function (el) { return el.getClientRects().length > 0; }
        );
        if (!focusable.length) return;
        var first = focusable[0];
        var last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      }

      function openDrawer() {
        lastFocused = document.activeElement;
        drawer.hidden = false;
        backdrop.hidden = false;
        menuToggle.setAttribute("aria-expanded", "true");
        document.body.classList.add("menu-open");
        drawerClose.focus();
        document.addEventListener("keydown", trapFocus);
      }
      function closeDrawer() {
        if (drawer.hidden) return;
        drawer.hidden = true;
        backdrop.hidden = true;
        menuToggle.setAttribute("aria-expanded", "false");
        document.body.classList.remove("menu-open");
        document.removeEventListener("keydown", trapFocus);
        if (lastFocused) lastFocused.focus();
      }

      menuToggle.addEventListener("click", function () {
        if (drawer.hidden) openDrawer();
        else closeDrawer();
      });
      drawerClose.addEventListener("click", closeDrawer);
      backdrop.addEventListener("click", closeDrawer);
      [navSlot, accountSlot].forEach(function (slot) {
        slot.addEventListener("click", function (e) {
          if (e.target.closest("a")) closeDrawer();
        });
      });
      document.addEventListener(
        "keydown",
        function (e) {
          if (e.key !== "Escape" || drawer.hidden) return;
          if (langSwitcher && langSwitcher.getAttribute("data-open") === "true") return;
          closeDrawer();
        },
        true
      );
      mq.addEventListener("change", function (e) {
        placeControls(e.matches);
        if (!e.matches) closeDrawer();
      });
    })();

        return wrap;
      }
      function renderSpreadsheetChaos(seedStr, urlText) {
        var seed = seedFromString(seedStr);
        var wrap = mockupChrome(urlText);
        var chaosWrap = el("div", "ui-chaos-wrap");
        var positions = [
          { top: "2%", left: "1%", rot: -6 },
          { top: "32%", left: "40%", rot: 4 },
          { top: "6%", left: "54%", rot: -3 },
          { top: "44%", left: "5%", rot: 5 },
        ];
        positions.forEach(function (pos, i) {
          var sheet = el("div", "ui-chaos-sheet");
          sheet.style.top = pos.top;
          sheet.style.left = pos.left;
          sheet.style.transform = "rotate(" + pos.rot + "deg)";
          for (var c = 0; c < 20; c++) {
            var cell = el("div", "ui-chaos-cell");
            if ((seed >>> (c + i)) % 5 === 0) cell.style.opacity = "0.35";
            sheet.appendChild(cell);
          }
          chaosWrap.appendChild(sheet);
        });
        wrap.appendChild(chaosWrap);
        return wrap;
      }
      var UI_MOCKUP_RENDERERS = {
        "queue-dashboard": function (seed, url) { return renderQueueDashboard(seed, url); },
        "alert-dashboard-flat": function (seed, url) { return renderAlertDashboard(seed, url, false); },
        "alert-dashboard-ranked": function (seed, url) { return renderAlertDashboard(seed, url, true); },
        "table-tracker": function (seed, url) { return renderTableTracker(seed, url); },
        "guided-form": function (seed, url) { return renderGuidedForm(seed, url); },
        "spreadsheet-chaos": function (seed, url) { return renderSpreadsheetChaos(seed, url); },
      };

      function renderThumb(project) {
        var wrap = el("div", "work-card-thumb");
        wrap.setAttribute("role", "img");
        wrap.setAttribute("aria-label", project.title);
        if (project.thumbnail && project.thumbnail.src) {
          var img = document.createElement("img");
          img.src = project.thumbnail.src;
          img.alt = "";
          img.style.width = "100%";
          img.style.height = "100%";
          img.style.objectFit = "cover";
          wrap.appendChild(img);
          return wrap;
        }
        // Cover matches the mockup shown as the hero image on the project's
        // own case-study page (heroMockup in work-data.js) — same visual
        // language start to finish, not a generic thumbnail.
        var mockupRenderer = project.heroMockup && UI_MOCKUP_RENDERERS[project.heroMockup];
        if (mockupRenderer) {
          wrap.appendChild(mockupRenderer(project.slug + "-cover", "app.internal"));
          wrap.appendChild(el("span", "fpo-stamp", "FPO"));
          return wrap;
        }
        var seed = seedFromString(project.slug);
        var svg = svgEl("svg", { viewBox: "0 0 320 200", preserveAspectRatio: "xMidYMid slice" });
        var gradId = "work-grad-" + (seed % 100000);
        var defs = svgEl("defs", {});
        var grad = svgEl("linearGradient", { id: gradId, x1: "0%", y1: "0%", x2: "100%", y2: "100%" });
        grad.appendChild(svgEl("stop", { offset: "0%", "stop-color": "var(--color-surface)" }));
        grad.appendChild(svgEl("stop", { offset: "100%", "stop-color": "var(--color-bg)" }));
        defs.appendChild(grad);
        svg.appendChild(defs);
        svg.appendChild(svgEl("rect", { x: 0, y: 0, width: 320, height: 200, fill: "url(#" + gradId + ")" }));
        svg.appendChild(svgEl("circle", {
          cx: 40 + (seed % 220), cy: 30 + ((seed >>> 4) % 140), r: 40 + ((seed >>> 8) % 60),
          fill: "var(--color-accent)", opacity: "0.16",
        }));
        svg.appendChild(svgEl("circle", {
          cx: 60 + ((seed >>> 12) % 220), cy: 40 + ((seed >>> 16) % 140), r: 30 + ((seed >>> 20) % 50),
          fill: "var(--color-accent-3)", opacity: "0.18",
        }));
        wrap.appendChild(svg);
        wrap.appendChild(el("span", "fpo-stamp", "FPO"));
        return wrap;
      }

      // Card content is deliberately limited to the five signals a
      // recruiter needs in a 30-second scan — Industry, Project type,
      // Role, Primary challenge, Key outcome — per the brief. The
      // generic one-sentence summary and tag chips that used to sit here
      // said less in more space, so they were dropped from the card (the
      // full summary/tags still live on the detail page).
      var INDUSTRY_I18N_KEYS = {
        "enterprise-ai": "industry_enterprise_ai",
        "cybersecurity": "industry_cybersecurity",
        "fintech": "industry_fintech",
        "government": "industry_government",
      };

      function renderCards() {
        var t = translations[document.documentElement.lang] || translations.en;
        var projects = window.MayaWork.getPublishedWorkProjects();
        grid.textContent = "";
        projects.forEach(function (project) {
          var card = el("article", "card surface work-card");
          card.appendChild(renderThumb(project));

          var body = el("div", "work-card-body");

          var topRow = el("div", "work-card-toprow");
          var industryKey = INDUSTRY_I18N_KEYS[project.industry];
          if (industryKey) topRow.appendChild(el("span", "industry-pill", t[industryKey] || project.industry));
          if (project.draft) topRow.appendChild(el("span", "work-badge", t.work_draft_badge));
          if (project.confidential) topRow.appendChild(el("span", "work-badge", t.work_confidential_badge));
          body.appendChild(topRow);

          var headingGroup = el("div", "work-card-heading-group");
          var heading = el("h3");
          var link = document.createElement("a");
          link.className = "work-card-link";
          link.href = "/work/" + project.slug;
          link.textContent = project.title;
          heading.appendChild(link);
          headingGroup.appendChild(heading);
          if (project.projectType) headingGroup.appendChild(el("p", "work-card-type", project.projectType));
          body.appendChild(headingGroup);

          if (project.cardChallenge || project.cardOutcome) {
            var signals = document.createElement("dl");
            signals.className = "work-card-signals";
            if (project.cardChallenge) {
              var challengeRow = el("div");
              challengeRow.appendChild(el("dt", null, t.work_challenge_label));
              challengeRow.appendChild(el("dd", null, project.cardChallenge));
              signals.appendChild(challengeRow);
            }
            if (project.cardOutcome) {
              var outcomeRow = el("div");
              outcomeRow.appendChild(el("dt", null, t.work_outcome_label));
              outcomeRow.appendChild(el("dd", null, project.cardOutcome));
              signals.appendChild(outcomeRow);
            }
            body.appendChild(signals);
          }

          if (project.role) {
            var footer = el("div", "work-card-footer");
            footer.appendChild(el("span", "work-card-role", project.role));
            body.appendChild(footer);
          }

          card.appendChild(body);
          grid.appendChild(card);
        });
      }

      renderCards();
      document.addEventListener("app:languagechange", renderCards);
    })();
  </script>
  <script src="footer-widget.js"></script>
</body>
</html>
