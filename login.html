<!doctype html>
<html lang="en">
<head>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        var theme =
          saved ||
          (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Maya Carroll</title>
  <meta name="robots" content="noindex, nofollow" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Inter+Tight:wght@600;650;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --font-display: "Inter Tight", sans-serif;
      --font-body: "Inter", sans-serif;
    }
    :root[data-theme="dark"] {
      --color-bg: #070b18;
      --color-surface: #10172a;
      --color-text: #f7f3ee;
      --color-text-secondary: #aab4c8;
      --color-accent: #ff5c7a;
      --color-border: rgba(247, 243, 238, 0.14);
      --focus-ring: #39e6d0;
      --shadow-elevated: 0 12px 40px rgba(0, 0, 0, 0.55);
    }
    :root[data-theme="light"] {
      --color-bg: #f5f7f6;
      --color-surface: #ffffff;
      --color-text: #17211e;
      --color-text-secondary: #60706a;
      --color-accent: #1f5a4a;
      --color-border: #dce6e2;
      --focus-ring: #1f5a4a;
      --shadow-elevated: 0 12px 32px rgba(23, 33, 30, 0.1);
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: var(--font-body);
      font-weight: 450;
      letter-spacing: -0.01em;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.5;
    }
    :focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }
    main {
      width: 100%;
      max-width: 24rem;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      box-shadow: var(--shadow-elevated);
      padding: 2rem;
      text-align: center;
    }
    .brand {
      display: inline-block;
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: -0.02em;
      font-size: 1.35rem;
      color: var(--color-text);
      text-decoration: none;
    }
    h1 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.15rem;
      margin: 1.25rem 0 0.4rem;
    }
    p {
      color: var(--color-text-secondary);
      font-size: 0.9rem;
      margin: 0 0 1.5rem;
    }
    #g_id_signin_target {
      display: flex;
      justify-content: center;
      min-height: 44px;
    }
    #auth-error {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: var(--color-accent);
    }
    #auth-error:empty {
      display: none;
    }
    .back-link {
      display: inline-block;
      margin-top: 1.75rem;
      font-size: 0.8rem;
      color: var(--color-text-secondary);
      text-decoration: none;
    }
    .back-link:hover {
      color: var(--color-text);
    }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="index.html">Maya Carroll</a>
    <h1>Sign in</h1>
    <p>This area is private — sign in with the authorized Google account.</p>
    <div id="g_id_signin_target" aria-live="polite"></div>
    <p id="auth-error" role="alert"></p>
    <a class="back-link" href="index.html">← Back to portfolio</a>
  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    // Google Client IDs are public identifiers, not secrets — safe to embed
    // directly. Must match the GOOGLE_CLIENT_ID env var the api/ functions
    // check against.
    var GOOGLE_CLIENT_ID = "582288217817-hju4ihh1mq72q8pl93liuqvmrj87vlhe.apps.googleusercontent.com";

    var errorEl = document.getElementById("auth-error");

    function handleCredentialResponse(response) {
      errorEl.textContent = "";
      fetch("/api/auth-google", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ credential: response.credential }),
      })
        .then(function (res) {
          return res.json().then(function (data) {
            if (!res.ok || !data.ok) throw new Error(data.error || "Sign-in failed.");
            window.location.href = "dashboard.html";
          });
        })
        .catch(function (err) {
          errorEl.textContent = err.message || "Sign-in failed. Please try again.";
        });
    }

    function initGoogleButton() {
      if (!window.google || !window.google.accounts || !window.google.accounts.id) {
        window.setTimeout(initGoogleButton, 100);
        return;
      }
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse,
      });
      google.accounts.id.renderButton(document.getElementById("g_id_signin_target"), {
        theme: document.documentElement.getAttribute("data-theme") === "dark" ? "filled_black" : "outline",
        size: "large",
        width: 280,
      });
    }

    // Already signed in? Skip straight to the dashboard.
    fetch("/api/session")
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.signedIn) {
          window.location.href = "dashboard.html";
        } else {
          initGoogleButton();
        }
      })
      .catch(initGoogleButton);
  </script>
</body>
</html>
