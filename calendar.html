<!doctype html>
<html lang="en">
<head>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        var theme =
          saved ||
          (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calendar — Maya Carroll</title>
  <meta name="robots" content="noindex, nofollow" />
  <link
    href="https://fonts.googleapis.com/css2?family=Allura&display=swap"
    rel="stylesheet"
  />
  <style>
    :root[data-theme="dark"] {
      --color-bg: #070b18;
      --color-surface: #10172a;
      --color-text: #f7f3ee;
      --color-text-secondary: #aab4c8;
      --color-accent: #ff5c7a;
      --color-border: rgba(247, 243, 238, 0.14);
      --focus-ring: #39e6d0;
    }
    :root[data-theme="light"] {
      --color-bg: #f5f7f6;
      --color-surface: #ffffff;
      --color-text: #17211e;
      --color-text-secondary: #60706a;
      --color-accent: #1f5a4a;
      --color-border: #dce6e2;
      --focus-ring: #1f5a4a;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.55;
    }
    :focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--color-border);
    }
    .brand {
      font-family: "Allura", cursive;
      font-size: 1.6rem;
      color: var(--color-text);
      text-decoration: none;
    }
    nav.crumbs {
      font-size: 0.8rem;
      color: var(--color-text-secondary);
    }
    nav.crumbs a {
      color: inherit;
    }
    #signed-in-as {
      font-size: 0.8rem;
      color: var(--color-text-secondary);
    }
    button {
      font-family: inherit;
      font-size: 0.85rem;
      background: transparent;
      color: var(--color-text-secondary);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      padding: 0.45rem 0.8rem;
      cursor: pointer;
    }
    button:hover {
      color: var(--color-text);
      border-color: var(--color-accent);
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }
    main[hidden] {
      display: none;
    }
    h1 {
      font-size: 1.6rem;
      margin: 0 0 0.5rem;
    }
    main p {
      color: var(--color-text-secondary);
    }
    .connect-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 1.5rem;
    }
    .connect-row button {
      padding: 0.6rem 1rem;
    }
    .connect-row button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="index.html">Maya Carroll</a>
    <div style="display: flex; align-items: center; gap: 0.9rem">
      <span id="signed-in-as"></span>
      <button id="sign-out" type="button">Sign out</button>
    </div>
  </header>

  <main hidden>
    <nav class="crumbs"><a href="dashboard.html">Dashboard</a> / Calendar</nav>
    <h1 style="margin-top: 1rem">Calendar</h1>
    <p>
      A single, merged view of your day across every Google and Outlook
      calendar you connect — not built yet, just the entry point.
    </p>
    <div class="connect-row">
      <button disabled type="button">Connect Google Calendar</button>
      <button disabled type="button">Connect Outlook Calendar</button>
    </div>
  </main>

  <script>
    var mainEl = document.querySelector("main");
    var signedInAsEl = document.getElementById("signed-in-as");

    fetch("/api/session")
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (!data.signedIn) {
          window.location.replace("login.html");
          return;
        }
        signedInAsEl.textContent = data.email;
        mainEl.hidden = false;
      })
      .catch(function () {
        window.location.replace("login.html");
      });

    document.getElementById("sign-out").addEventListener("click", function () {
      fetch("/api/logout", { method: "POST" }).finally(function () {
        window.location.href = "login.html";
      });
    });
  </script>
</body>
</html>
