<!doctype html>
<html lang="en">
<head>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        var theme =
          saved ||
          (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calendar — Maya Carroll</title>
  <meta name="robots" content="noindex, nofollow" />
  <link
    href="https://fonts.googleapis.com/css2?family=Allura&display=swap"
    rel="stylesheet"
  />
  <style>
    :root[data-theme="dark"] {
      --color-bg: #070b18;
      --color-surface: #10172a;
      --color-text: #f7f3ee;
      --color-text-secondary: #aab4c8;
      --color-accent: #ff5c7a;
      --color-accent-2: #39e6d0;
      --color-border: rgba(247, 243, 238, 0.14);
      --focus-ring: #39e6d0;
      --warning: #f4c76b;
    }
    :root[data-theme="light"] {
      --color-bg: #f5f7f6;
      --color-surface: #ffffff;
      --color-text: #17211e;
      --color-text-secondary: #60706a;
      --color-accent: #1f5a4a;
      --color-accent-2: #1f5a4a;
      --color-border: #dce6e2;
      --focus-ring: #1f5a4a;
      --warning: #b5760f;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.55;
    }
    :focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--color-border);
    }
    .brand {
      font-family: "Allura", cursive;
      font-size: 1.6rem;
      color: var(--color-text);
      text-decoration: none;
    }
    nav.crumbs {
      font-size: 0.8rem;
      color: var(--color-text-secondary);
    }
    nav.crumbs a {
      color: inherit;
    }
    #signed-in-as {
      font-size: 0.8rem;
      color: var(--color-text-secondary);
    }
    button,
    .btn {
      font-family: inherit;
      font-size: 0.85rem;
      background: transparent;
      color: var(--color-text-secondary);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      padding: 0.45rem 0.8rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    button:hover,
    .btn:hover {
      color: var(--color-text);
      border-color: var(--color-accent);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    button:disabled:hover {
      color: var(--color-text-secondary);
      border-color: var(--color-border);
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }
    main[hidden] {
      display: none;
    }
    h1 {
      font-size: 1.6rem;
      margin: 0 0 0.5rem;
    }
    h2 {
      font-size: 1rem;
      margin: 2.5rem 0 1rem;
    }
    main > p {
      color: var(--color-text-secondary);
    }
    .banner {
      margin-top: 1.25rem;
      padding: 0.7rem 0.9rem;
      border-radius: 6px;
      font-size: 0.85rem;
      border: 1px solid var(--color-border);
    }
    .banner.success {
      border-color: var(--color-accent-2);
      color: var(--color-accent-2);
    }
    .banner.error {
      border-color: var(--warning);
      color: var(--warning);
    }
    .connect-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }
    .connect-row .btn {
      padding: 0.6rem 1rem;
    }
    .account-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .account-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--color-border);
    }
    .account-meta {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    .account-meta .email {
      font-size: 0.9rem;
    }
    .account-meta .provider {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--color-text-secondary);
    }
    .account-meta .account-error {
      font-size: 0.78rem;
      color: var(--warning);
    }
    .agenda {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .agenda li {
      display: flex;
      gap: 1rem;
      padding: 0.7rem 0;
      border-bottom: 1px solid var(--color-border);
    }
    .agenda time {
      flex: 0 0 auto;
      width: 5.5rem;
      color: var(--color-text-secondary);
      font-variant-numeric: tabular-nums;
      font-size: 0.85rem;
    }
    .agenda .event-title {
      font-size: 0.92rem;
    }
    .agenda .event-source {
      font-size: 0.75rem;
      color: var(--color-text-secondary);
    }
    .empty-state {
      color: var(--color-text-secondary);
      font-size: 0.9rem;
    }
    .week-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin: 2.5rem 0 1.25rem;
    }
    .week-nav .range-label {
      font-size: 0.85rem;
      color: var(--color-text-secondary);
      font-variant-numeric: tabular-nums;
    }
    .day-section {
      margin-bottom: 1.75rem;
    }
    .day-heading {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      margin: 0 0 0.4rem;
      color: var(--color-text-secondary);
    }
    .day-heading .day-heading-date {
      color: var(--color-text);
    }
    .day-heading .today-badge {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--color-accent);
      border: 1px solid var(--color-accent);
      border-radius: 4px;
      padding: 0.05rem 0.4rem;
    }
    .day-empty {
      color: var(--color-text-secondary);
      font-size: 0.85rem;
      opacity: 0.75;
      padding: 0.3rem 0;
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="index.html">Maya Carroll</a>
    <div style="display: flex; align-items: center; gap: 0.9rem">
      <span id="signed-in-as"></span>
      <button id="sign-out" type="button">Sign out</button>
    </div>
  </header>

  <main hidden>
    <nav class="crumbs"><a href="dashboard.html">Dashboard</a> / Calendar</nav>
    <h1 style="margin-top: 1rem">Calendar</h1>
    <p>A single, merged view of today across every calendar you connect.</p>

    <div id="status-banner" hidden></div>

    <h2>Connected accounts</h2>
    <ul class="account-list" id="account-list"></ul>
    <p class="empty-state" id="no-accounts" hidden>No calendars connected yet.</p>
    <div class="connect-row">
      <a class="btn" href="/api/oauth/google-connect">Connect Google Calendar</a>
      <a class="btn" href="/api/oauth/microsoft-connect">Connect Outlook Calendar</a>
    </div>

    <div class="week-nav">
      <button id="prev-week" type="button" aria-label="Previous week">← Previous</button>
      <span class="range-label" id="week-range-label" aria-live="polite"></span>
      <button id="next-week" type="button" aria-label="Next week">Next →</button>
    </div>
    <p class="empty-state" id="week-loading">Loading…</p>
    <p class="empty-state" id="week-empty" hidden>
      Nothing on the calendar this week — or nothing connected yet.
    </p>
    <div id="week-days" hidden></div>
  </main>

  <script>
    var mainEl = document.querySelector("main");
    var signedInAsEl = document.getElementById("signed-in-as");
    var accountListEl = document.getElementById("account-list");
    var noAccountsEl = document.getElementById("no-accounts");
    var weekLoadingEl = document.getElementById("week-loading");
    var weekEmptyEl = document.getElementById("week-empty");
    var weekDaysEl = document.getElementById("week-days");
    var weekRangeLabelEl = document.getElementById("week-range-label");
    var statusBannerEl = document.getElementById("status-banner");

    var HOME_TIMEZONE = "America/New_York";
    var WEEK_DAYS = 7;
    var currentAnchor = null; // "YYYY-MM-DD", set from the server's notion of "today" on first load

    var PROVIDER_LABELS = { google: "Google Calendar", microsoft: "Outlook Calendar" };

    function showBanner(kind, text) {
      statusBannerEl.className = "banner " + kind;
      statusBannerEl.textContent = text;
      statusBannerEl.hidden = false;
    }

    function handleQueryParams() {
      var params = new URLSearchParams(window.location.search);
      var connected = params.get("connected");
      var error = params.get("error");
      if (connected) {
        showBanner("success", (PROVIDER_LABELS[connected] || connected) + " connected.");
      } else if (error === "no_refresh_token") {
        showBanner(
          "error",
          "That account was already connected once before without offline access. Try disconnecting it, then reconnect."
        );
      } else if (error) {
        showBanner("error", "Couldn't connect that account (" + error + "). Please try again.");
      }
      if (connected || error) {
        var url = new URL(window.location.href);
        url.searchParams.delete("connected");
        url.searchParams.delete("error");
        window.history.replaceState({}, "", url.toString());
      }
    }

    function renderAccounts(accounts) {
      accountListEl.innerHTML = "";
      noAccountsEl.hidden = accounts.length > 0;
      accounts.forEach(function (account) {
        var li = document.createElement("li");

        var meta = document.createElement("div");
        meta.className = "account-meta";
        var providerEl = document.createElement("span");
        providerEl.className = "provider";
        providerEl.textContent = PROVIDER_LABELS[account.provider] || account.provider;
        var emailEl = document.createElement("span");
        emailEl.className = "email";
        emailEl.textContent = account.email;
        meta.appendChild(providerEl);
        meta.appendChild(emailEl);
        if (account.error) {
          var errEl = document.createElement("span");
          errEl.className = "account-error";
          errEl.textContent = account.error;
          meta.appendChild(errEl);
        }

        var disconnectBtn = document.createElement("button");
        disconnectBtn.type = "button";
        disconnectBtn.textContent = "Disconnect";
        disconnectBtn.addEventListener("click", function () {
          disconnectBtn.disabled = true;
          fetch("/api/calendar-disconnect", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: account.id }),
          })
            .then(function () {
              loadEverything();
            })
            .catch(function () {
              disconnectBtn.disabled = false;
            });
        });

        li.appendChild(meta);
        li.appendChild(disconnectBtn);
        accountListEl.appendChild(li);
      });
    }

    function formatEventTime(iso, allDay) {
      if (allDay) return "All day";
      return new Intl.DateTimeFormat(undefined, {
        hour: "numeric",
        minute: "2-digit",
        timeZone: HOME_TIMEZONE,
      }).format(new Date(iso));
    }

    // Pure calendar-date arithmetic, mirroring api/_day-range.js's addDays —
    // dateStr is just a "YYYY-MM-DD" label, so plain UTC math is safe here.
    function addDaysLocal(dateStr, n) {
      var parts = dateStr.split("-").map(Number);
      var dt = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
      dt.setUTCDate(dt.getUTCDate() + n);
      return dt.toISOString().slice(0, 10);
    }

    function dayKeyInZone(iso, allDay) {
      if (allDay) return iso.slice(0, 10);
      var parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: HOME_TIMEZONE,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
      }).formatToParts(new Date(iso));
      var get = function (t) { return parts.find(function (p) { return p.type === t; }).value; };
      return get("year") + "-" + get("month") + "-" + get("day");
    }

    function formatDayHeading(dateStr) {
      // dateStr is a plain calendar-date label — parsed as UTC noon so it
      // never rolls to the adjacent day under any local browser timezone.
      var d = new Date(dateStr + "T12:00:00Z");
      return new Intl.DateTimeFormat(undefined, {
        weekday: "long",
        month: "short",
        day: "numeric",
        timeZone: "UTC",
      }).format(d);
    }

    function formatRangeLabel(startDate, endDate) {
      var fmt = new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", timeZone: "UTC" });
      var start = fmt.format(new Date(startDate + "T12:00:00Z"));
      var end = fmt.format(new Date(endDate + "T12:00:00Z"));
      return start + " – " + end;
    }

    function renderWeek(data) {
      weekLoadingEl.hidden = true;
      var events = data.events || [];
      var todayKey = dayKeyInZone(new Date().toISOString(), false);

      weekRangeLabelEl.textContent = formatRangeLabel(data.startDate, data.endDate);

      var byDay = {};
      events.forEach(function (event) {
        var key = dayKeyInZone(event.start, event.allDay);
        (byDay[key] = byDay[key] || []).push(event);
      });

      weekDaysEl.innerHTML = "";
      var dayCount = 0;
      var cursor = data.startDate;
      while (cursor <= data.endDate) {
        dayCount++;
        renderDaySection(cursor, byDay[cursor] || [], cursor === todayKey);
        cursor = addDaysLocal(cursor, 1);
        if (dayCount > 31) break; // safety net against a malformed range
      }

      weekEmptyEl.hidden = events.length > 0;
      weekDaysEl.hidden = false;
    }

    function renderDaySection(dateStr, dayEvents, isToday) {
      var section = document.createElement("div");
      section.className = "day-section";

      var heading = document.createElement("h3");
      heading.className = "day-heading";
      var dateSpan = document.createElement("span");
      dateSpan.className = "day-heading-date";
      dateSpan.textContent = formatDayHeading(dateStr);
      heading.appendChild(dateSpan);
      if (isToday) {
        var badge = document.createElement("span");
        badge.className = "today-badge";
        badge.textContent = "Today";
        heading.appendChild(badge);
      }
      section.appendChild(heading);

      if (!dayEvents.length) {
        var empty = document.createElement("p");
        empty.className = "day-empty";
        empty.textContent = "No events";
        section.appendChild(empty);
        weekDaysEl.appendChild(section);
        return;
      }

      var list = document.createElement("ul");
      list.className = "agenda";
      dayEvents
        .slice()
        .sort(function (a, b) { return new Date(a.start) - new Date(b.start); })
        .forEach(function (event) {
          var li = document.createElement("li");

          var timeEl = document.createElement("time");
          timeEl.textContent = formatEventTime(event.start, event.allDay);

          var body = document.createElement("div");
          var titleEl = document.createElement("div");
          titleEl.className = "event-title";
          titleEl.textContent = event.title;
          var sourceEl = document.createElement("div");
          sourceEl.className = "event-source";
          sourceEl.textContent = event.accountEmail;
          body.appendChild(titleEl);
          body.appendChild(sourceEl);

          li.appendChild(timeEl);
          li.appendChild(body);
          list.appendChild(li);
        });
      section.appendChild(list);
      weekDaysEl.appendChild(section);
    }

    var prevWeekBtn = document.getElementById("prev-week");
    var nextWeekBtn = document.getElementById("next-week");

    function loadWeek(anchorDate) {
      weekLoadingEl.hidden = false;
      weekEmptyEl.hidden = true;
      weekDaysEl.hidden = true;
      // Disabled for the duration of the request — otherwise a fast
      // double-click both fire from the same stale currentAnchor (it isn't
      // updated until the response lands) and one navigation step is lost.
      prevWeekBtn.disabled = true;
      nextWeekBtn.disabled = true;

      var url = "/api/calendar-events?days=" + WEEK_DAYS + (anchorDate ? "&date=" + anchorDate : "");
      fetch(url)
        .then(function (res) { return res.json(); })
        .then(function (data) {
          currentAnchor = data.startDate;
          renderWeek(data);
          if (data.accounts) renderAccounts(data.accounts);
        })
        .catch(function () {
          weekLoadingEl.hidden = true;
          weekEmptyEl.hidden = false;
        })
        .finally(function () {
          prevWeekBtn.disabled = false;
          nextWeekBtn.disabled = false;
        });
    }

    function loadEverything() {
      fetch("/api/calendar-accounts")
        .then(function (res) { return res.json(); })
        .then(function (data) {
          renderAccounts(data.accounts || []);
        });
      loadWeek(currentAnchor);
    }

    document.getElementById("prev-week").addEventListener("click", function () {
      loadWeek(addDaysLocal(currentAnchor, -WEEK_DAYS));
    });
    document.getElementById("next-week").addEventListener("click", function () {
      loadWeek(addDaysLocal(currentAnchor, WEEK_DAYS));
    });

    fetch("/api/session")
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (!data.signedIn) {
          window.location.replace("login.html");
          return;
        }
        signedInAsEl.textContent = data.email;
        mainEl.hidden = false;
        handleQueryParams();
        loadEverything();
      })
      .catch(function () {
        window.location.replace("login.html");
      });

    document.getElementById("sign-out").addEventListener("click", function () {
      fetch("/api/logout", { method: "POST" }).finally(function () {
        window.location.href = "login.html";
      });
    });
  </script>
</body>
</html>
