<!doctype html>
<html lang="en">
<head>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        var theme =
          saved ||
          (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — Maya Carroll</title>
  <meta name="robots" content="noindex, nofollow" />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --font-primary: "Manrope", sans-serif;
    }
    :root[data-theme="dark"] {
      --color-bg: #070b18;
      --color-surface: #10172a;
      --color-text: #f7f3ee;
      --color-text-secondary: #aab4c8;
      --color-accent: #39e6d0;
      --color-accent-3: #f4c76b;
      --color-border: rgba(247, 243, 238, 0.14);
      --focus-ring: #39e6d0;
      --shadow-elevated: 0 12px 40px rgba(0, 0, 0, 0.55);
      --glow-hover: 0 0 0 1px rgba(57, 230, 208, 0.4), 0 0 18px rgba(57, 230, 208, 0.28);
    }
    :root[data-theme="light"] {
      --color-bg: #f5f7f6;
      --color-surface: #ffffff;
      --color-text: #17211e;
      --color-text-secondary: #60706a;
      --color-accent: #1f5a4a;
      --color-accent-3: #dce6e2;
      --color-border: #dce6e2;
      --focus-ring: #1f5a4a;
      --shadow-elevated: 0 12px 32px rgba(23, 33, 30, 0.1);
      --glow-hover: 0 0 0 1px rgba(31, 90, 74, 0.25), 0 6px 20px rgba(23, 33, 30, 0.1);
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: var(--font-primary);
      font-weight: 400;
      letter-spacing: -0.01em;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.55;
    }
    :focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }
    main {
      flex: 1 0 auto;
      max-width: 40rem;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }
    main[hidden] {
      display: none;
    }
    h1 {
      font-family: var(--font-primary);
      font-weight: 700;
      font-size: 1.6rem;
      margin: 0 0 0.5rem;
    }
    main p {
      color: var(--color-text-secondary);
    }

    /* ==================== Header (same as index.html) ====================
       Two coordinated levels: #header-primary (brand / nav / preferences /
       menu button). Below 960px, #primary-nav and #preferences move into
       the mobile drawer via the same reparenting script used on the
       homepage — kept byte-identical across pages on purpose so it doesn't
       drift. No #city-strip and no #motion-toggle here — there's no
       animated background on this page to pause. */
    #topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-border);
    }
    #header-primary {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      padding: 0.85rem 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    #brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
      color: inherit;
      flex-shrink: 0;
    }
    #nav-avatar {
      width: 2.6rem;
      height: 2.6rem;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--color-accent-3);
      flex-shrink: 0;
    }
    #site-title {
      font-family: var(--font-primary);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--color-text);
      line-height: 1;
      font-size: 1.35rem;
      white-space: nowrap;
    }
    .site-title-short {
      display: none;
    }
    @media (max-width: 599px) {
      #site-title {
        font-size: 1.15rem;
      }
      .site-title-full {
        display: none;
      }
      .site-title-short {
        display: inline;
      }
    }
    #primary-nav {
      display: flex;
      gap: 1.6rem;
      font-size: 0.9rem;
      margin-right: auto;
    }
    #primary-nav a {
      color: var(--color-text-secondary);
      text-decoration: none;
      padding: 0.3rem 0.1rem;
    }
    #primary-nav a:hover,
    #primary-nav a:focus-visible {
      color: var(--color-text);
    }
    #primary-nav a.nav-signin {
      margin-left: 0.4rem;
      padding-left: 1rem;
      border-left: 1px solid var(--color-border);
      font-size: 0.8rem;
      opacity: 0.75;
    }
    #primary-nav a.nav-signin:hover,
    #primary-nav a.nav-signin:focus-visible {
      opacity: 1;
    }
    #primary-nav a.nav-signin ~ a.nav-signin {
      margin-left: 0.6rem;
      padding-left: 0;
      border-left: none;
    }
    #preferences {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    button {
      font-family: var(--font-primary);
      font-weight: 600;
    }
    #theme-toggle,
    #lang-toggle {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.82rem;
      background: var(--color-surface);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      cursor: pointer;
      min-height: 44px;
      padding: 0.5rem 0.75rem;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.1s ease;
    }
    #theme-toggle:hover,
    #lang-toggle:hover {
      border-color: var(--color-accent);
      box-shadow: var(--glow-hover);
    }
    #theme-toggle:active,
    #lang-toggle:active {
      transform: scale(0.96);
    }
    #theme-label {
      font-weight: 600;
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
    #lang-switcher {
      position: relative;
    }
    #lang-toggle .chevron {
      color: var(--color-text-secondary);
      font-size: 0.7rem;
      transition: transform 0.15s ease;
    }
    #lang-switcher[data-open="true"] #lang-toggle .chevron {
      transform: rotate(180deg);
    }
    #lang-menu {
      position: absolute;
      top: calc(100% + 0.4rem);
      right: 0;
      min-width: 100%;
      list-style: none;
      margin: 0;
      padding: 0.3rem;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-top: 2px solid var(--color-accent);
      border-radius: 8px;
      box-shadow: var(--shadow-elevated);
      display: none;
      flex-direction: column;
      z-index: 5;
    }
    #lang-switcher[data-open="true"] #lang-menu {
      display: flex;
    }
    #lang-menu li button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: inherit;
      background: transparent;
      color: var(--color-text);
      border: none;
      border-radius: 5px;
      padding: 0.4rem 0.6rem;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
      min-height: 40px;
      transition: background 0.15s ease;
    }
    #lang-menu li button:hover {
      background: var(--color-bg);
    }
    #lang-menu li button[aria-current="true"] {
      background: var(--color-bg);
      box-shadow: inset 2px 0 0 var(--color-accent);
    }
    .flag {
      font-size: 1.1rem;
    }
    .globe {
      font-size: 1rem;
    }
    .menu-heading {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--color-text-secondary);
      padding: 0.3rem 0.6rem 0.4rem;
    }
    #menu-toggle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      background: var(--color-surface);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      cursor: pointer;
    }
    #menu-toggle:hover {
      border-color: var(--color-accent);
    }
    .menu-icon {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 18px;
    }
    .menu-icon span {
      display: block;
      height: 2px;
      border-radius: 1px;
      background: currentColor;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    #menu-toggle[aria-expanded="true"] .menu-icon span:nth-child(1) {
      transform: translateY(6px) rotate(45deg);
    }
    #menu-toggle[aria-expanded="true"] .menu-icon span:nth-child(2) {
      opacity: 0;
    }
    #menu-toggle[aria-expanded="true"] .menu-icon span:nth-child(3) {
      transform: translateY(-6px) rotate(-45deg);
    }
    @media (prefers-reduced-motion: reduce) {
      .menu-icon span {
        transition: none;
      }
    }
    @media (max-width: 959px) {
      #primary-nav,
      #header-primary > #preferences {
        display: none;
      }
      #menu-toggle {
        display: flex;
        margin-left: auto;
      }
    }
    #mobile-menu-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 40;
    }
    #mobile-menu-backdrop[hidden] {
      display: none;
    }
    #mobile-menu {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(320px, 85vw);
      background: var(--color-surface);
      border-left: 1px solid var(--color-border);
      z-index: 50;
      display: flex;
      flex-direction: column;
      padding: 1.25rem;
      overflow-y: auto;
      box-shadow: var(--shadow-elevated);
    }
    #mobile-menu[hidden] {
      display: none;
    }
    #mobile-menu-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }
    #mobile-menu-title {
      font-weight: 700;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-text-secondary);
    }
    #mobile-menu-close {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      line-height: 1;
      background: transparent;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      color: var(--color-text);
      cursor: pointer;
    }
    #mobile-menu-close:hover {
      border-color: var(--color-accent);
    }
    #mobile-menu-nav-slot #primary-nav {
      display: flex;
      flex-direction: column;
      gap: 0;
      font-size: 1.05rem;
      margin: 0 0 1.5rem;
    }
    #mobile-menu-nav-slot #primary-nav a {
      padding: 0.8rem 0.2rem;
      border-bottom: 1px solid var(--color-border);
      min-height: 44px;
      display: flex;
      align-items: center;
    }
    #mobile-menu-nav-slot #primary-nav a[hidden] {
      display: none;
    }
    #mobile-menu-nav-slot a.nav-signin {
      margin-left: 0;
      padding-left: 0.2rem;
      border-left: none;
      border-top: 1px solid var(--color-border);
      opacity: 0.75;
    }
    #mobile-menu-prefs .menu-heading {
      padding: 0 0 0.6rem;
    }
    #mobile-menu-prefs-slot #preferences {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.6rem;
    }
    #mobile-menu-prefs-slot #theme-toggle,
    #mobile-menu-prefs-slot #lang-toggle {
      width: 100%;
      justify-content: flex-start;
      font-size: 0.92rem;
    }
    #mobile-menu-prefs-slot #lang-menu {
      position: static;
      margin-top: 0.4rem;
      box-shadow: none;
      display: flex;
    }
    #mobile-menu-prefs-slot #lang-switcher[data-open="false"] #lang-menu {
      display: none;
    }
    body.menu-open {
      overflow: hidden;
    }

    footer {
      text-align: center;
      padding: 0.85rem 1.5rem 1rem;
    }
    footer .copyright {
      margin: 0;
      font-size: 0.75rem;
      font-weight: 500;
      opacity: 0.8;
      color: var(--color-text-secondary);
    }
  </style>
</head>
<body>
  <header id="topbar">
    <div id="header-primary">
      <a id="brand" href="index.html" aria-label="Maya Carroll — Home">
        <img id="nav-avatar" src="avatar.jpg" alt="" />
        <span id="site-title">
          <span class="site-title-full">Maya Carroll</span>
          <span class="site-title-short">Maya</span>
        </span>
      </a>

      <nav id="primary-nav" aria-label="Primary">
        <a href="index.html#work" data-i18n="nav_work">Work</a>
        <a href="index.html#experience" data-i18n="nav_experience">Experience</a>
        <a href="index.html#contact" data-i18n="nav_contact">Contact</a>
        <a class="nav-signin" id="nav-calendar" href="calendar.html" data-i18n="nav_calendar">Calendar</a>
        <a class="nav-signin" id="nav-dashboard" href="dashboard.html" data-i18n="nav_dashboard">Dashboard</a>
        <a class="nav-signin" id="nav-signout" href="login.html" data-i18n="nav_signout">Sign out</a>
      </nav>

      <div id="preferences" aria-label="Preferences">
        <button type="button" id="theme-toggle" aria-label="Switch to light theme">
          <span id="theme-icon" aria-hidden="true">🌙</span>
          <span id="theme-label">Dark</span>
        </button>

        <div id="lang-switcher" data-open="false">
          <button type="button" id="lang-toggle" aria-haspopup="listbox" aria-expanded="false" aria-label="Choose language: English">
            <span class="globe" aria-hidden="true">🌐</span>
            <span id="lang-toggle-label">EN</span>
            <span class="chevron" aria-hidden="true">▼</span>
          </button>
          <ul id="lang-menu" role="listbox" aria-label="Select language">
            <li class="menu-heading" aria-hidden="true">Language</li>
            <li role="option"><button type="button" data-lang="en"><span class="flag" aria-hidden="true">🇬🇧</span> English</button></li>
            <li role="option"><button type="button" data-lang="es"><span class="flag" aria-hidden="true">🇪🇸</span> Español</button></li>
            <li role="option"><button type="button" data-lang="fi"><span class="flag" aria-hidden="true">🇫🇮</span> Suomi</button></li>
          </ul>
        </div>
      </div>

      <button type="button" id="menu-toggle" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu">
        <span class="menu-icon" aria-hidden="true">
          <span></span><span></span><span></span>
        </span>
      </button>
    </div>
  </header>

  <div id="mobile-menu-backdrop" hidden></div>
  <div id="mobile-menu" role="dialog" aria-modal="true" aria-label="Menu" hidden>
    <div id="mobile-menu-header">
      <span id="mobile-menu-title" data-i18n="menu_title">Menu</span>
      <button type="button" id="mobile-menu-close" aria-label="Close menu">&times;</button>
    </div>
    <div id="mobile-menu-nav-slot" aria-label="Primary"></div>
    <div id="mobile-menu-prefs">
      <h3 class="menu-heading" data-i18n="menu_preferences">Preferences</h3>
      <div id="mobile-menu-prefs-slot"></div>
    </div>
  </div>

  <main hidden>
    <h1>Private dashboard</h1>
    <p>
      This space is just for you — signed in and ready for whatever personal
      organization tools get added here next.
    </p>
    <p><a href="calendar.html">Calendar →</a></p>
  </main>

  <footer>
    <p class="copyright">&copy; <span id="footer-year"></span> Maya Carroll</p>
  </footer>

  <script>
    var translations = {
      en: {
        label: "EN",
        fullName: "English",
        menu_title: "Menu",
        menu_preferences: "Preferences",
        nav_work: "Work",
        nav_experience: "Experience",
        nav_contact: "Contact",
        nav_calendar: "Calendar",
        nav_dashboard: "Dashboard",
        nav_signout: "Sign out",
      },
      es: {
        label: "ES",
        fullName: "Español",
        menu_title: "Menú",
        menu_preferences: "Preferencias",
        nav_work: "Trabajo",
        nav_experience: "Experiencia",
        nav_contact: "Contacto",
        nav_calendar: "Calendario",
        nav_dashboard: "Panel",
        nav_signout: "Cerrar sesión",
      },
      fi: {
        label: "FI",
        fullName: "Suomi",
        menu_title: "Valikko",
        menu_preferences: "Asetukset",
        nav_work: "Työt",
        nav_experience: "Kokemus",
        nav_contact: "Yhteystiedot",
        nav_calendar: "Kalenteri",
        nav_dashboard: "Kojelauta",
        nav_signout: "Kirjaudu ulos",
      },
    };

    var mainEl = document.querySelector("main");
    document.getElementById("footer-year").textContent = new Date().getFullYear();

    // ---------- Theme toggle ----------
    var themeToggle = document.getElementById("theme-toggle");
    var themeIcon = document.getElementById("theme-icon");
    var themeLabel = document.getElementById("theme-label");

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      themeIcon.textContent = theme === "dark" ? "🌙" : "☀️";
      themeLabel.textContent = theme === "dark" ? "Dark" : "Light";
      themeToggle.setAttribute(
        "aria-label",
        theme === "dark" ? "Theme: Dark. Switch to light theme" : "Theme: Light. Switch to dark theme"
      );
    }
    applyTheme(document.documentElement.getAttribute("data-theme") || "light");
    themeToggle.addEventListener("click", function () {
      var current = document.documentElement.getAttribute("data-theme");
      var next = current === "dark" ? "light" : "dark";
      applyTheme(next);
      localStorage.setItem("theme", next);
    });
    if (window.matchMedia) {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function (e) {
        if (!localStorage.getItem("theme")) applyTheme(e.matches ? "dark" : "light");
      });
    }

    // ---------- Language switcher ----------
    var switcher = document.getElementById("lang-switcher");
    var langToggle = document.getElementById("lang-toggle");
    var toggleLabel = document.getElementById("lang-toggle-label");
    var langOptions = document.querySelectorAll("#lang-menu button");
    var i18nEls = document.querySelectorAll("[data-i18n]");

    function setLanguage(lang) {
      var t = translations[lang];
      if (!t) return;
      i18nEls.forEach(function (el) {
        var key = el.dataset.i18n;
        if (t[key]) el.textContent = t[key];
      });
      toggleLabel.textContent = t.label;
      langToggle.setAttribute("aria-label", "Language: " + t.fullName + ". Choose a different language");
      document.documentElement.lang = lang;
      langOptions.forEach(function (opt) {
        opt.setAttribute("aria-current", opt.dataset.lang === lang ? "true" : "false");
      });
      localStorage.setItem("lang", lang);
    }

    function openLangMenu(open) {
      switcher.setAttribute("data-open", String(open));
      langToggle.setAttribute("aria-expanded", String(open));
    }
    langToggle.addEventListener("click", function () {
      openLangMenu(switcher.getAttribute("data-open") !== "true");
    });
    langOptions.forEach(function (opt) {
      opt.addEventListener("click", function () {
        setLanguage(opt.dataset.lang);
        openLangMenu(false);
      });
    });
    document.addEventListener("click", function (e) {
      if (!switcher.contains(e.target)) openLangMenu(false);
    });

    function getDeviceLanguage() {
      var preferences = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
      var match = preferences.map(function (tag) { return tag.slice(0, 2).toLowerCase(); }).find(function (code) { return translations[code]; });
      return match || "en";
    }
    setLanguage(localStorage.getItem("lang") || getDeviceLanguage());

    // ---------- Header: responsive reparenting + mobile drawer ----------
    (function () {
      var topbar = document.getElementById("topbar");
      var headerPrimary = document.getElementById("header-primary");
      var nav = document.getElementById("primary-nav");
      var prefs = document.getElementById("preferences");
      var menuToggle = document.getElementById("menu-toggle");
      var backdrop = document.getElementById("mobile-menu-backdrop");
      var drawer = document.getElementById("mobile-menu");
      var drawerClose = document.getElementById("mobile-menu-close");
      var navSlot = document.getElementById("mobile-menu-nav-slot");
      var prefsSlot = document.getElementById("mobile-menu-prefs-slot");
      var langSwitcher = document.getElementById("lang-switcher");
      if (!topbar || !headerPrimary || !nav || !prefs || !menuToggle || !drawer) return;

      var mq = window.matchMedia("(max-width: 959px)");
      function placeControls(isNarrow) {
        if (isNarrow) {
          navSlot.appendChild(nav);
          prefsSlot.appendChild(prefs);
        } else {
          headerPrimary.insertBefore(nav, menuToggle);
          headerPrimary.insertBefore(prefs, menuToggle);
        }
      }
      placeControls(mq.matches);

      var lastFocused = null;
      function trapFocus(e) {
        if (e.key !== "Tab") return;
        var focusable = Array.prototype.filter.call(
          drawer.querySelectorAll('a[href], button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"])'),
          function (el) { return el.getClientRects().length > 0; }
        );
        if (!focusable.length) return;
        var first = focusable[0];
        var last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      }

      function openDrawer() {
        lastFocused = document.activeElement;
        drawer.hidden = false;
        backdrop.hidden = false;
        menuToggle.setAttribute("aria-expanded", "true");
        document.body.classList.add("menu-open");
        drawerClose.focus();
        document.addEventListener("keydown", trapFocus);
      }
      function closeDrawer() {
        if (drawer.hidden) return;
        drawer.hidden = true;
        backdrop.hidden = true;
        menuToggle.setAttribute("aria-expanded", "false");
        document.body.classList.remove("menu-open");
        document.removeEventListener("keydown", trapFocus);
        if (lastFocused) lastFocused.focus();
      }

      menuToggle.addEventListener("click", function () {
        if (drawer.hidden) openDrawer();
        else closeDrawer();
      });
      drawerClose.addEventListener("click", closeDrawer);
      backdrop.addEventListener("click", closeDrawer);
      navSlot.addEventListener("click", function (e) {
        if (e.target.closest("a")) closeDrawer();
      });
      document.addEventListener(
        "keydown",
        function (e) {
          if (e.key !== "Escape" || drawer.hidden) return;
          if (langSwitcher && langSwitcher.getAttribute("data-open") === "true") return;
          closeDrawer();
        },
        true
      );
      mq.addEventListener("change", function (e) {
        placeControls(e.matches);
        if (!e.matches) closeDrawer();
      });
    })();

    // ---------- Sign out ----------
    document.getElementById("nav-signout").addEventListener("click", function (e) {
      e.preventDefault();
      fetch("/api/logout", { method: "POST" }).finally(function () {
        window.location.href = "login.html";
      });
    });

    // ---------- Auth gate ----------
    fetch("/api/session")
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (!data.signedIn) {
          window.location.replace("login.html");
          return;
        }
        mainEl.hidden = false;
      })
      .catch(function () {
        window.location.replace("login.html");
      });
  </script>
</body>
</html>
